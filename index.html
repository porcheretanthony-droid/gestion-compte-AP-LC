/* Palette claire et apaisée — bleu ciel, menthe, abricot, lavande */
:root{
  --ink:#20324f;
  --muted:#718096;
  --bg:#f7f9fc;
  --card:#ffffff;
  --line:#e6ebf2;
  --primary:#5b8def;
  --primary2:#79a7f5;
  --mint:#dff5ea;
  --mint-ink:#267a56;
  --rose:#fae8e9;
  --rose-ink:#a5525c;
  --sky:#e6f1ff;
  --sky-ink:#3f72b5;
  --lav:#eee9fb;
  --lav-ink:#705fa7;
  --apricot:#fff0dc;
  --apricot-ink:#9a6b35;
}
body{background:linear-gradient(145deg,#fbfcfe 0%,#f6f9fc 55%,#faf8fc 100%);color:var(--ink)}
.logo,.primary,.nav button.on{
  background:linear-gradient(135deg,var(--primary2),var(--primary));
  box-shadow:0 7px 18px rgba(91,141,239,.16)
}
.stat,.panel,.acct,.section{
  border-color:var(--line);
  box-shadow:0 8px 24px rgba(49,74,110,.065)
}
.stat.green{background:linear-gradient(135deg,#f7fdf9,var(--mint));color:var(--mint-ink)}
.stat.red{background:linear-gradient(135deg,#fffafa,var(--rose));color:var(--rose-ink);box-shadow:0 8px 24px rgba(165,82,92,.07)}
.stat.blue{background:linear-gradient(135deg,#f8fbff,var(--sky));color:var(--sky-ink)}
.stat.purple{background:linear-gradient(135deg,#fcfaff,var(--lav));color:var(--lav-ink)}
.a1{background:linear-gradient(135deg,#f4f9ff,#dcecff)}
.a2{background:linear-gradient(135deg,#fffaf2,var(--apricot))}
.ac{background:linear-gradient(135deg,#faf8ff,var(--lav))}
.saldo{background:linear-gradient(135deg,#f7fbff,#e8f2ff);color:#4776b6}
.bar{background:#edf1f6}.bar i{background:linear-gradient(90deg,#9bc0f8,#6d9bef)}
.add,.variableReset{background:#edf5ff;color:#4c73aa}
.feednote{background:linear-gradient(135deg,#f8fbff,#eef5ff);color:#526d91;border-color:#dce8f7}
.reset{background:#eaf3ff;color:#4a73ad}.pdf{background:#e8f7ef;color:#37795c}
.del,.danger{background:#fbecee;color:#a95560}
.nav{box-shadow:0 3px 14px rgba(49,74,110,.05)}


/* === ÉDITION QUOTIDIENNE PREMIUM === */
:root{
 --bg:#f5f7fa;--surface:#ffffff;--ink:#17243b;--muted:#718096;--line:#e7ebf1;
 --navy:#334e68;--blue:#5e83b6;--blue-soft:#edf3fa;
 --sage:#6f9b86;--sage-soft:#edf6f1;
 --rose:#a9787f;--rose-soft:#f8eff0;
 --champagne:#b29168;--champagne-soft:#f8f2e9;
 --lav:#81769f;--lav-soft:#f2eff7;
}
body{background:linear-gradient(145deg,#fafbfc 0%,#f4f7fa 52%,#f8f6f7 100%);color:var(--ink)}
.wrap{max-width:1200px}
.logo{background:linear-gradient(145deg,#55779f,#334e68);box-shadow:0 9px 24px rgba(51,78,104,.16)}
.primary{background:linear-gradient(135deg,#607fa7,#405f83);box-shadow:0 8px 22px rgba(64,95,131,.16)}
.nav{border-color:var(--line);box-shadow:0 5px 18px rgba(37,55,80,.045)}
.nav button.on{background:linear-gradient(135deg,#607fa7,#405f83);box-shadow:0 6px 16px rgba(64,95,131,.13)}
.stat,.panel,.acct,.section{border-color:var(--line);box-shadow:0 8px 28px rgba(30,48,72,.055)}
.stat.green{background:linear-gradient(135deg,#f9fcfa,var(--sage-soft));color:#4e7c67}
.stat.red{background:linear-gradient(135deg,#fdfafa,var(--rose-soft));color:#8d5d65;box-shadow:0 8px 28px rgba(100,70,76,.05)}
.stat.blue{background:linear-gradient(135deg,#fbfdff,var(--blue-soft));color:#486d9a}
.stat.purple{background:linear-gradient(135deg,#fcfbfd,var(--lav-soft));color:#675d86}
.a1{background:linear-gradient(135deg,#f4f8fc,#e4edf7)}
.a2{background:linear-gradient(135deg,#fcf8f3,#f3e9dd)}
.ac{background:linear-gradient(135deg,#faf9fc,#ece9f2)}
.saldo{background:linear-gradient(135deg,#f8fafc,#edf3f8);color:#486786}
.bar{background:#edf0f4}.bar i{background:linear-gradient(90deg,#a8bbd1,#6f8faf)}
.add,.variableReset{background:#edf3f8;color:#4c6989}
.feednote{background:linear-gradient(135deg,#fafbfc,#f1f4f8);color:#5b6f87;border-color:#e1e7ef}
.reset{background:#edf3f8;color:#4c6989}.pdf{background:#edf6f1;color:#527b67}
.del,.danger{background:#f8eff0;color:#8d5d65}
.accthead{letter-spacing:-.01em}
.crownmark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;margin-right:8px;font-size:17px;vertical-align:middle}
.crown-u1{background:#e9f0f8;color:#4f7097}
.crown-u2{background:#f5ede4;color:#987957}
.crown-common{background:#efedf4;color:#73698d}
@media(max-width:560px){
 .wrap{padding:10px}.header{margin-bottom:12px}.nav{margin-bottom:14px}
 .acct,.panel,.section,.stat{border-radius:15px}.brand h1{font-size:24px}
}


/* === MOBILE : cartes plus lisibles et faciles à toucher === */
@media(max-width:700px){
  body{font-size:16px}
  .wrap{padding:10px 10px 22px}
  .header{gap:10px}
  .brand{width:100%}
  .brand p{font-size:12px}
  .header .primary{min-height:48px;font-size:15px}
  .nav{padding:6px;gap:6px;border-radius:15px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{min-height:44px;padding:10px 15px;font-size:14px}

  /* Totaux : une vraie carte par ligne pour éviter l'effet tassé */
  .stats{grid-template-columns:1fr!important;gap:10px}
  .stat{min-height:76px;padding:14px 16px;border:1px solid #dfe5ed}
  .stat small{font-size:13px}
  .stat b{font-size:23px}
  .bubble{width:44px;height:44px}

  /* Comptes */
  .accounts{grid-template-columns:1fr;gap:13px;margin:14px 0}
  .acct{border:1px solid #dfe5ed}
  .accthead{padding:15px 16px;font-size:17px}
  .acctbody{padding:14px}
  .twocol{gap:9px}
  .mini{padding:13px 8px}
  .mini b{font-size:18px}
  .saldo{padding:13px}

  /* Pages utilisateur */
  .accountTitle{align-items:flex-start;flex-direction:column}
  .accountTitle .primary{width:100%}
  .subnav{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .subnav button{min-height:44px;padding:9px 7px;font-size:13px}

  /* Champs : libellé en haut, montant + suppression en dessous */
  .row,.row.withflag{
    grid-template-columns:minmax(0,1fr) 42px;
    gap:8px;
    padding:10px;
    margin:9px 0;
    border:1px solid #e2e7ee;
    border-radius:13px;
    background:#fbfcfd;
  }
  .row input:first-child{grid-column:1 / -1}
  .row .money{grid-column:1;min-height:46px;font-size:17px;font-weight:700;text-align:left}
  .row .del{grid-column:2;grid-row:2;min-height:46px}
  .row .flag{grid-column:1 / -1;grid-row:auto;min-height:40px}
  .row input{min-height:44px;font-size:16px}
  .add,.variableReset{width:100%;min-height:46px}

  /* Graphiques : pleine largeur */
  .charts,.formgrid{grid-template-columns:1fr;gap:12px}
  .panel,.section{padding:15px}
  .panel h2,.section h2{font-size:17px}
  .chart{height:265px;min-width:0}
  canvas{max-width:100%}

  /* Opérations et actions */
  .op{grid-template-columns:minmax(0,1fr) auto;padding:12px 8px}
  .bottom{grid-template-columns:1fr;gap:10px}
  .bottom button{min-height:50px}
}
@media(max-width:380px){
  .wrap{padding-left:8px;padding-right:8px}
  .subnav{grid-template-columns:1fr}
  .chart{height:245px}
  .brand h1{font-size:22px}
}

 --warm-blue:#55779a;
 --warm-sage:#718b7b;

 background:
   radial-gradient(circle at 15% 0%,rgba(194,164,125,.10),transparent 28%),
   linear-gradient(180deg,#f7f5f1 0%,var(--warm-bg) 100%);

}
.wrap{max-width:1200px}
.header{padding:4px 2px}

.a2{background:linear-gradient(135deg,#fbf8f3,#f1e8dc)}
.ac{background:linear-gradient(135deg,#f9f8f7,#ebe8e6)}
.saldo{background:linear-gradient(135deg,#f8fafb,#eaf0f4);color:#425f79}
.bar{background:#e8e5df}.bar i{background:linear-gradient(90deg,#7893aa,#4e708d)}
.add,.variableReset{background:#eaf0f4;color:#425f79}
.feednote{background:#f5f3ef;color:#5e6670;border-color:#e2ddd5}
.reset{background:#ebeef0;color:#425f79}
.pdf{background:#e9f0eb;color:#526e5d}
.del,.danger{background:#f5e9e5;color:#8c594b}

.crown-u2{background:#f2e9df;color:#8a6c4d}

input,select{color:var(--warm-ink)}
.row input{border-color:#ddd9d2;background:#fff}
@media(max-width:700px){

 .row,.row.withflag{background:#fffefa;border-color:#dedbd5}

</style></head><body><div class="wrap"><header class="header"><div class="brand"><div class="logo">▰</div><div><h1>Gestion compte AP-LC</h1><p>Pilotez simplement vos revenus, dépenses et comptes</p></div></div><button class="primary" onclick="openNewExpense()">＋ Nouvelle dépense</button></header><nav class="nav" id="nav"></nav><main><section id="dashboard" class="page on"></section><section id="u1" class="page"></section><section id="u2" class="page"></section><section id="common" class="page"></section><section id="settings" class="page"></section><section id="pdfReport" class="pdfReport"></section></main></div><div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><button class="close" onclick="closeModal()">✕</button><h2>Ajouter une dépense</h2><p class="hint">Choisissez le compte. Vous pourrez ensuite saisir le libellé et le montant.</p><div class="choices" id="choices"></div></div></div>
<script>
const blank=()=>({income:[['Salaire','0']],expense:[],variable:[],annual:[]});
const fresh=()=>({version:5,names:{u1:'Utilisateur 1',u2:'Utilisateur 2'},
u1:{income:[['Salaire','0']],expense:[['Compte commun','0',{feedCommon:true}],['Logement','0'],['Alimentation','0'],['Transport','0'],['Assurance','0'],['Autres','0']],variable:[['Courses','0'],['Sorties / loisirs','0']],annual:[['Impôts','0'],['Autres dépenses annuelles','0']]},
u2:{income:[['Salaire','0']],expense:[['Compte commun','0',{feedCommon:true}],['Logement','0'],['Alimentation','0'],['Transport','0'],['Assurance','0'],['Autres','0']],variable:[['Courses','0'],['Sorties / loisirs','0']],annual:[['Impôts','0'],['Autres dépenses annuelles','0']]},
common:{income:[],expense:[['Logement','0'],['Assurance maison','0'],['Électricité','0'],['Eau','0'],['Autres','0']],variable:[],annual:[]},
operations:[],history:{}});
const STORAGE_KEY='gestionCompteAPLC_prive_local_v1';let data;try{data=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch(e){} if(!data)data=fresh();['u1','u2','common'].forEach(a=>{if(!data[a])data[a]=blank();['income','expense','variable','annual'].forEach(t=>{if(!Array.isArray(data[a][t]))data[a][t]=[]})});if(!data.names)data.names={u1:'Utilisateur 1',u2:'Utilisateur 2'};if(!data.operations)data.operations=[];if(!data.history)data.history={};
['u1','u2'].forEach(a=>{let row=(data[a].expense||[]).find(x=>String(x[0]).toLowerCase().includes('compte commun'));if(!row){data[a].expense.unshift(['Compte commun','0',{feedCommon:true}])}else{if(!row[2]||typeof row[2]!=='object')row[2]={};row[2].feedCommon=true}});
let current='dashboard', accountTab={u1:'expense',u2:'expense',common:'expense'};
const E=n=>Number(n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});function N(v){v=String(v??'0').replace(/,/g,'.').replace(/\s/g,'');if(!v)return 0;if(!/^[0-9+\-*/().]+$/.test(v))return 0;try{return Number(Function('"use strict";return ('+v+')')())||0}catch(e){return 0}}function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function save(){snapshot();localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}function sum(a,t){return(data[a][t]||[]).reduce((s,x)=>s+N(x[1]),0)}function flag(x,k){return !!(x&&x[2]&&typeof x[2]==='object'&&x[2][k])}function commonPart(a){return (data[a].expense||[]).reduce((q,x)=>q+(flag(x,'feedCommon')?N(x[1]):0),0)}function commonFeed(){return commonPart('u1')+commonPart('u2')}function totals(a){let i=a==='common'?commonFeed():sum(a,'income'),e=sum(a,'expense')+sum(a,'variable')+sum(a,'annual')/12;return[i,e,i-e]}function personalExpensesWithoutCommonTransfer(a){
  const monthly=(data[a].expense||[]).reduce((s,x)=>s+(flag(x,'feedCommon')?0:N(x[1])),0);
  return monthly+sum(a,'variable')+sum(a,'annual')/12;
}
function all(){
  const revenus=totals('u1')[0]+totals('u2')[0];
  const depenses=personalExpensesWithoutCommonTransfer('u1')
                +personalExpensesWithoutCommonTransfer('u2')
                +totals('common')[1];
  return [revenus,depenses];
}function title(a){return a==='u1'?data.names.u1:a==='u2'?data.names.u2:'Compte commun'}function monthKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}function snapshot(){data.history[monthKey()]=all()[1];let keys=Object.keys(data.history).sort();while(keys.length>12){delete data.history[keys.shift()]}}
function nav(){let items=[['dashboard','⌂ Vue générale'],['u1','♔ '+esc(data.names.u1)],['u2','♕ '+esc(data.names.u2)],['common','◇ Compte commun'],['settings','⚙ Paramètres']];document.getElementById('nav').innerHTML=items.map(x=>`<button class="${current===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}function go(id){current=id;render();window.scrollTo({top:0,behavior:'smooth'})}
function accountCard(a,cls){let[i,e,s]=totals(a),pct=i>0?Math.min(100,Math.max(0,e/i*100)):0;return`<div class="acct"><div class="accthead ${cls}"><span><span class="crownmark ${a==='u1'?'crown-u1':a==='u2'?'crown-u2':'crown-common'}">${a==='u1'?'♔':a==='u2'?'♕':'◇'}</span>${esc(title(a))}</span><button onclick="go('${a}')" title="Ouvrir le compte">⋮</button></div><div class="acctbody"><div class="twocol"><div class="mini green"><span>Revenus</span><b>${E(i)}</b></div><div class="mini red"><span>Dépenses</span><b>${E(e)}</b></div></div><div class="saldo"><span>Solde</span><b>${E(s)}</b></div><div class="bar"><i style="width:${pct}%"></i></div><div class="hint" style="text-align:right;margin-top:5px">${Math.round(pct)}% utilisé</div></div></div>`}
function operationsHTML(){let ops=data.operations.slice(0,8);if(!ops.length)return`<div class="empty"><div><b style="font-size:25px">▱</b><br><b>Aucune opération pour le moment</b><br><span>Vos modifications de montants apparaîtront ici.</span></div></div>`;return`<div class="oplist">${ops.map(o=>`<div class="op"><div><b>${esc(o.label)}</b><br><small>${esc(o.account)} · ${esc(o.kind)} · ${esc(o.date)}</small></div><b class="${o.kind==='Revenu'?'income':''}">${E(o.amount)}</b></div>`).join('')}</div>`}
function dashboard(){let[i,e]=all(),s=i-e;document.getElementById('dashboard').innerHTML=`<div class="stats"><div class="stat green"><div class="bubble">↓</div><div><small>Revenus totaux</small><b>${E(i)}</b></div></div><div class="stat red"><div class="bubble">↑</div><div><small>Dépenses totales</small><b>${E(e)}</b></div></div><div class="stat blue"><div class="bubble">▣</div><div><small>Solde total</small><b>${E(s)}</b></div></div><div class="stat purple"><div class="bubble">▥</div><div><small>Épargne</small><b>${E(Math.max(0,s))}</b></div></div></div><div class="feednote" style="margin:14px 0 0"><b>Calcul global :</b> les versements vers le compte commun sont des transferts internes : ils restent dans la dépense personnelle de chaque utilisateur, mais ne sont pas recomptés dans les dépenses globales. Les dépenses réellement payées par le compte commun sont ajoutées au total.</div><div class="accounts">${accountCard('u1','a1')}${accountCard('u2','a2')}${accountCard('common','ac')}</div><div class="charts"><div class="panel"><h2>▥ &nbsp; Répartition des dépenses</h2><div class="chart"><canvas id="donut"></canvas></div></div><div class="panel"><h2>⌁ &nbsp; Évolution des dépenses</h2><div class="chart"><canvas id="line"></canvas></div></div></div><div class="panel ops"><h2>☷ &nbsp; Dernières opérations</h2>${operationsHTML()}</div><div class="bottom"><button class="reset" onclick="resetAll()">↻ &nbsp; Remettre les comptes à zéro</button><button class="pdf" onclick="printPDF()">⇩ &nbsp; Exporter en PDF</button></div>`;requestAnimationFrame(drawCharts)}
function rows(a,t){return data[a][t].map((x,i)=>{let feed=t==='expense'&&a!=='common',reset=t==='variable',extra=feed?`<label class="flag"><input type="checkbox" ${flag(x,'feedCommon')?'checked':''} onchange="setFlag('${a}','${t}',${i},'feedCommon',this.checked)">Transfert vers le compte commun</label>`:reset?`<label class="flag"><input type="checkbox" ${flag(x,'resetZero')?'checked':''} onchange="setFlag('${a}','${t}',${i},'resetZero',this.checked)">Remise à 0</label>`:'';return `<div class="row ${extra?'withflag':''}"><input aria-label="Libellé" value="${esc(x[0])}" onchange="edit('${a}','${t}',${i},0,this.value)"><input class="money" aria-label="Montant" inputmode="decimal" value="${esc(x[1])}" onchange="edit('${a}','${t}',${i},1,this.value)" placeholder="0">${extra}<button class="del" onclick="del('${a}','${t}',${i})" title="Supprimer">×</button></div>`}).join('')||'<p class="hint">Aucune ligne pour le moment.</p>'}
function accountPage(a){let[i,e,s]=totals(a),tab=accountTab[a]||'expense',meta={income:['💰 Revenus','revenu'],expense:['🧾 Dépenses mensuelles','dépense'],variable:['🛒 Dépenses variables','dépense variable'],annual:['📅 Dépenses annuelles','dépense annuelle']};document.getElementById(a).innerHTML=`<div class="accountTitle"><h2>${esc(title(a))}</h2>${a!=='common'?`<button class="primary" onclick="go('settings')">Modifier le nom</button>`:''}</div><div class="stats" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px"><div class="stat green"><div><small>Revenus</small><b>${E(i)}</b></div></div><div class="stat red"><div><small>Dépenses</small><b>${E(e)}</b></div></div><div class="stat blue"><div><small>Solde</small><b>${E(s)}</b></div></div></div><div class="charts" style="margin-bottom:18px"><div class="panel"><h2>▥ &nbsp; Répartition des dépenses</h2><div class="chart"><canvas id="donut-${a}"></canvas></div></div><div class="panel"><h2>▥ &nbsp; Revenus / dépenses / solde</h2><div class="chart"><canvas id="bars-${a}"></canvas></div></div></div><div class="section"><div class="subnav">${Object.keys(meta).map(t=>`<button class="${tab===t?'on':''}" onclick="setTab('${a}','${t}')">${meta[t][0]}</button>`).join('')}</div><h2>${meta[tab][0]}</h2>${tab==='annual'?'<p class="hint annualNote">Saisissez le montant annuel : il est automatiquement divisé par 12 dans le budget mensuel.</p>':''}${a==='common'&&tab==='income'?`<div class="feednote"><b>Versements mensuels vers le compte commun</b><br>Ces montants proviennent automatiquement de la dépense mensuelle « Compte commun » de chaque utilisateur.</div><div class="row"><input value="${esc(data.names.u1)}" disabled><input class="money" value="${E(commonPart('u1'))}" disabled><span></span></div><div class="row"><input value="${esc(data.names.u2)}" disabled><input class="money" value="${E(commonPart('u2'))}" disabled><span></span></div>`:rows(a,tab)}${a==='common'&&tab==='income'?'':`<button class="add" onclick="add('${a}','${tab}')">＋ Ajouter ${meta[tab][1]}</button>`}${tab==='variable'?`<button class="variableReset" onclick="resetVariables('${a}')">↻ Remettre à 0 les variables cochées</button>`:''}</div>`}function setTab(a,t){accountTab[a]=t;render()}
function settings(){document.getElementById('settings').innerHTML=`<div class="section settings">
<h2>⚙ Réglages</h2>
<p class="hint">Personnalisez l’application et protégez vos données. Les informations restent enregistrées sur cet appareil.</p>
<div class="settingsGrid">
  <div class="settingCard">
    <h3>👤 Utilisateurs</h3>
    <p>Modifiez les noms affichés dans les comptes et les graphiques.</p>
    <label>Nom de l'utilisateur 1</label><input id="n1" maxlength="30" value="${esc(data.names.u1)}">
    <label>Nom de l'utilisateur 2</label><input id="n2" maxlength="30" value="${esc(data.names.u2)}">
    <button class="primary save" onclick="saveNames()">Enregistrer les noms</button>
  </div>
  <div class="settingCard">

    <div class="settingActions">
      <button class="secondary" onclick="exportBackup()">Exporter la sauvegarde</button>
      <label class="fileLabel">Importer une sauvegarde<input type="file" accept=".json,application/json" onchange="importBackup(this)"></label>
    </div>
  </div>
  <div class="settingCard">
    <h3>🧾 Historique</h3>
    <p>Efface uniquement la liste des dernières opérations. Les montants de vos comptes restent inchangés.</p>
    <button class="secondary" onclick="clearHistory()">Effacer l'historique</button>
  </div>
  <div class="settingCard">
    <h3>↻ Remise à zéro</h3>
    <p>Restaure les montants AP-LC enregistrés dans cette version.</p>
    <button class="danger" onclick="resetAll()">Remettre les comptes à zéro</button>
  </div>
</div></div>`}
function exportBackup(){
  save();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='gestion-compte-AP-LC-sauvegarde.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),500);
  toast('Sauvegarde exportée');
}
function importBackup(input){
  const f=input.files&&input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);
    if(!d||!d.names||!d.u1||!d.u2||!d.common)throw new Error();
    data=d;
    if(!data.operations)data.operations=[];
    if(!data.history)data.history={};

  }catch(e){alert('Cette sauvegarde n’est pas valide.');}
  input.value='';
  };
  r.readAsText(f);

function saveNames(){data.names.u1=(document.getElementById('n1').value||'Utilisateur 1').trim();data.names.u2=(document.getElementById('n2').value||'Utilisateur 2').trim();save();toast('Noms enregistrés');render()}
function logOp(a,t,i,v){let amount=N(v);if(!amount)return;let kind=t==='income'?'Revenu':t==='annual'?'Dépense annuelle':t==='variable'?'Dépense variable':'Dépense';let label=data[a][t][i]?.[0]||kind;data.operations.unshift({date:new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'}),account:title(a),kind,label,amount});data.operations=data.operations.slice(0,40)}
function setFlag(a,t,i,k,v){if(!data[a][t][i][2]||typeof data[a][t][i][2]!=='object')data[a][t][i][2]={};data[a][t][i][2][k]=v;save();render()}function resetVariables(a){let n=0;(data[a].variable||[]).forEach(x=>{if(flag(x,'resetZero')){x[1]='0';n++}});save();toast(n?n+' variable(s) remise(s) à 0':'Aucune variable cochée');render()}function edit(a,t,i,k,v){data[a][t][i][k]=v;if(k===1)logOp(a,t,i,v);save();render()}function add(a,t){let labels={income:'Nouveau revenu',expense:'Nouvelle dépense',variable:'Nouvelle dépense variable',annual:'Nouvelle dépense annuelle'};data[a][t].push([labels[t],'0']);save();render()}function del(a,t,i){data[a][t].splice(i,1);save();render()}function resetAll(){if(confirm('Remettre tous les comptes à zéro ?')){data=fresh();save();toast('Comptes remis à zéro');render()}}function clearHistory(){if(confirm("Effacer l'historique des opérations et du graphique ?")){data.operations=[];data.history={};save();render()}}
function openNewExpense(){document.getElementById('choices').innerHTML=['u1','u2','common'].map(a=>`<button class="choice" onclick="newExpense('${a}')">${esc(title(a))}</button>`).join('');document.getElementById('modal').classList.add('on')}function closeModal(){document.getElementById('modal').classList.remove('on')}function newExpense(a){closeModal();accountTab[a]='expense';data[a].expense.push(['Nouvelle dépense','0']);save();go(a);setTimeout(()=>{let p=document.getElementById(a);let inputs=p.querySelectorAll('.row input');if(inputs.length>=2)inputs[inputs.length-2].focus()},100)}function toast(msg){let n=document.createElement('div');n.className='toast';n.textContent='✓ '+msg;document.body.appendChild(n);setTimeout(()=>n.remove(),1800)}

function pdfRowsForAccount(a){
  const r=[];
  (data[a].expense||[]).forEach(x=>{let v=N(x[1]);if(v)r.push([x[0],v,flag(x,'feedCommon')?'Transfert interne':'Mensuelle'])});
  (data[a].variable||[]).forEach(x=>{let v=N(x[1]);if(v)r.push([x[0],v,'Variable'])});
  (data[a].annual||[]).forEach(x=>{let v=N(x[1])/12;if(v)r.push([x[0],v,'Annuelle / 12'])});
  return r;
}
function pdfAscii(s){
  return String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/€/g,' EUR').replace(/[^\x20-\x7E]/g,' ');
}
function pdfEsc(s){return pdfAscii(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}
function pdfMoney(n){
  let x=Number(n||0), sign=x<0?'-':'', a=Math.abs(x).toFixed(2).split('.');
  a[0]=a[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return sign+a[0]+','+a[1]+' EUR';
}
function createRealPDF(){

        terra=[0.66,0.44,0.36], blue=[0.33,0.47,0.60];
  const pages=[]; let ops=[], y=H-M;
  const c=a=>a.join(' ');
  const txt=(x,yy,s,size=10,bold=false,col=ink)=>ops.push(`BT /${bold?'F2':'F1'} ${size} Tf ${c(col)} rg 1 0 0 1 ${x} ${yy} Tm (${pdfEsc(s)}) Tj ET`);
  const rect=(x,yy,w,h,fill=null,stroke=line)=>{if(fill)ops.push(`${c(fill)} rg ${x} ${yy} ${w} ${h} re f`);if(stroke)ops.push(`${c(stroke)} RG 0.7 w ${x} ${yy} ${w} ${h} re S`)};
  const rule=(x1,yy1,x2,yy2,col=line,w=.7)=>ops.push(`${c(col)} RG ${w} w ${x1} ${yy1} m ${x2} ${yy2} l S`);
  const newPage=()=>{if(ops.length)pages.push(ops.join('\n'));ops=[];y=H-M};
  const need=h=>{if(y-h<M+18){newPage(); header(false)}};

  const add=s=>{objs.push(s);return objs.length-1};

  const pagesId=add('PAGES_PLACEHOLDER');
  const pageIds=[];
  pages.forEach(stream=>{
    const sid=add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
    const pid=add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${font1} 0 R /F2 ${font2} 0 R >> >> /Contents ${sid} 0 R >>`);
    pageIds.push(pid);

  objs[pagesId]=`<< /Type /Pages /Kids [${pageIds.map(i=>i+' 0 R').join(' ')}] /Count ${pageIds.length} >>`;
  const catalog=add(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`);
  let pdf='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n', offsets=[0];
  for(let i=1;i<objs.length;i++){offsets[i]=pdf.length;pdf+=`${i} 0 obj\n${objs[i]}\nendobj\n`}

  pdf+=`trailer\n<< /Size ${objs.length} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return new Blob([new Uint8Array([...pdf].map(ch=>ch.charCodeAt(0)&255))],{type:'application/pdf'});
}
