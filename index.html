<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gestion budget</title>
<meta name="theme-color" content="#f4f2ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gestion budget">
<script>
/* Avant l'affichage : thème choisi + masquage si un code est actif */
try{var th=localStorage.getItem('gestionCompteAPLC_theme');if(th==='rose'||th==='sombre')document.documentElement.dataset.theme=th;
if(localStorage.getItem('gestionCompteAPLC_pin'))document.documentElement.classList.add('locked')}catch(e){}
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f2ee;--surface:#fffefa;--ink:#1d2a3a;--muted:#687484;--line:#dedbd5;
  --navy:#263e57;--navy2:#496b8c;
  --pos:#557461;--pos-bg:#edf3ee;--neg:#8c594b;--neg-bg:#f6ece8;
  --info:#476985;--info-bg:#eaf0f5;--lav:#685f72;--lav-bg:#f0edf2;
  --soft:#eaf0f4;--soft-ink:#425f79;--field:#fff;--real:#a86f5c;
  --shadow:0 8px 24px rgba(52,48,43,.055);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);background:radial-gradient(circle at 15% 0%,rgba(194,164,125,.10),transparent 28%),linear-gradient(180deg,#f7f5f1 0%,var(--bg) 100%);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy2);outline-offset:2px}
.wrap{max-width:1200px;margin:auto;padding:22px;padding-top:max(22px,env(safe-area-inset-top));padding-bottom:max(22px,env(safe-area-inset-bottom));padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right))}

/* En-tête */
.header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px;padding:4px 2px}
.brand{display:flex;gap:13px;align-items:center}
.logo{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;text-align:center;font-weight:800;font-size:13px;line-height:1.05;color:#fff;background:linear-gradient(145deg,var(--navy2),var(--navy));box-shadow:0 8px 20px rgba(38,62,87,.15)}
.brand h1{margin:0;font-size:28px;color:#1b2c40;letter-spacing:-.025em}
.brand p{margin:2px 0 0;color:var(--muted)}
.primary{border:0;border-radius:15px;padding:14px 20px;font-weight:750;color:#fff;background:linear-gradient(135deg,var(--navy2),var(--navy));box-shadow:0 7px 18px rgba(38,62,87,.14)}
.secondary{border:0;border-radius:11px;padding:11px 14px;background:var(--soft);color:var(--soft-ink);font-weight:700}
.danger{border:1px solid #ecd6cf;border-radius:12px;padding:11px 14px;background:var(--neg-bg);color:var(--neg);font-weight:700}

/* Navigation */
.nav{display:flex;gap:8px;overflow:auto;padding:8px;margin-bottom:20px;background:rgba(255,254,250,.92);border:1px solid var(--line);border-radius:18px;box-shadow:0 5px 18px rgba(44,53,64,.045);scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:transparent;border-radius:14px;padding:12px 20px;white-space:nowrap;color:#243a60;font-weight:650}
.nav button.on{color:#fff;background:linear-gradient(135deg,var(--navy2),var(--navy));box-shadow:0 6px 16px rgba(38,62,87,.13)}

/* Cartes */
.stat,.panel,.acct,.section{background:var(--surface);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stats.three{grid-template-columns:repeat(3,1fr);margin-bottom:18px}
.stat{padding:18px;display:flex;gap:14px;align-items:center}
.stat small{font-size:15px}
.stat b{display:block;font-size:27px;margin-top:4px;font-variant-numeric:tabular-nums}
.bubble{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:27px;background:rgba(255,255,255,.55)}
.stat.green{background:linear-gradient(135deg,#fbfdfb,var(--pos-bg));color:var(--pos)}
.stat.red{background:linear-gradient(135deg,#fffdfc,var(--neg-bg));color:var(--neg)}
.stat.blue{background:linear-gradient(135deg,#fcfdfe,var(--info-bg));color:var(--info)}
.stat.purple{background:linear-gradient(135deg,#fdfcfd,var(--lav-bg));color:var(--lav)}
.stat.blue.negative{background:linear-gradient(135deg,#fffdfc,var(--neg-bg));color:var(--neg)}

.accounts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:18px 0}
.acct{overflow:hidden}
.accthead{padding:16px 18px;font-weight:800;font-size:18px;display:flex;justify-content:space-between;align-items:center;letter-spacing:-.01em}
.accthead button{border:0;background:rgba(255,255,255,.6);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--soft-ink)}
.a1{background:linear-gradient(135deg,#f5f8fa,#e3ebf1)}
.a2{background:linear-gradient(135deg,#fbf8f3,#f1e8dc)}
.ac{background:linear-gradient(135deg,#f9f8f7,#ebe8e6)}
.crownmark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;margin-right:8px;font-size:17px;vertical-align:middle}
.crown-u1{background:#e7edf2;color:#4c6c88}.crown-u2{background:#f2e9df;color:#8a6c4d}.crown-common{background:#eceae8;color:#69625c}
.acctbody{padding:16px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{padding:14px;text-align:center;border-radius:11px}
.mini span{display:block;font-size:13px}
.mini b{font-size:20px;font-variant-numeric:tabular-nums}
.mini.green{background:var(--pos-bg);color:var(--pos)}.mini.red{background:var(--neg-bg);color:var(--neg)}
.saldo{margin-top:12px;text-align:center;border-radius:11px;padding:12px;background:linear-gradient(135deg,#f8fafb,#eaf0f4);color:#425f79}
.saldo.negative{background:var(--neg-bg);color:var(--neg)}
.saldo span{display:block}.saldo b{font-size:23px;font-variant-numeric:tabular-nums}
.bar{height:9px;background:#e8e5df;border-radius:9px;margin-top:17px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7893aa,#4e708d)}
.bar.over i{background:linear-gradient(90deg,#c08d7d,#a86f5c)}
.hint{font-size:13px;color:#70809a}

.charts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{padding:20px}
.panel h2,.section h2{font-size:18px;margin:0 0 15px}
.chart{height:250px;min-width:0}
.chart canvas{width:100%;height:100%;display:block}

.feednote{margin:14px 0 0;padding:10px 12px;border-radius:11px;font-size:13px;background:#f5f3ef;color:#5e6670;border:1px solid #e2ddd5}
.feednote summary{cursor:pointer;font-weight:700}
.feednote p{margin:8px 0 0;line-height:1.45}

.ops{margin-top:18px}
.empty{min-height:130px;background:#fbfaf7;border-radius:12px;display:grid;place-items:center;text-align:center;color:#60718d;padding:12px}
.oplist{display:grid}
.op{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 12px;border-bottom:1px solid #ece9e3;align-items:center}
.op:last-child{border-bottom:0}
.op small{color:#7b899e}
.op .amt{text-align:right;font-variant-numeric:tabular-nums}
.op .amt small{display:block;font-weight:400}
.op .amt.income b{color:var(--pos)}

.bottom{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.bottom button{border:0;border-radius:14px;padding:15px;font-weight:750}
.pdf{background:#e9f0eb;color:#526e5d}
.backup{background:var(--soft);color:var(--soft-ink)}

/* Pages */
.page{display:none}.page.on{display:block}
.accountTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 16px}
.accountTitle h2{margin:0}
.section{padding:18px}
.subnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.subnav button{border:1px solid #dcd8d1;background:var(--field);border-radius:12px;padding:9px 12px;color:#29466f}
.subnav button.on{background:var(--info-bg);color:#365a80;border-color:#c3d2e0}
.annualNote{margin:-4px 0 10px}
.total-line{display:flex;justify-content:space-between;padding:10px 4px 0;margin-top:6px;border-top:1px dashed var(--line);font-weight:700;color:var(--soft-ink)}

.row{display:grid;grid-template-columns:1fr 130px 42px;gap:8px;margin:8px 0}
.row.withflag{grid-template-columns:1fr 130px minmax(145px,auto) 42px}
.row>input{border:1px solid #ddd9d2;border-radius:10px;padding:11px;min-width:0;background:var(--field)}
.row>input:disabled{background:#f6f4f0;color:var(--muted)}
.row .money{text-align:right;font-variant-numeric:tabular-nums}
.del{border:0;border-radius:10px;background:var(--neg-bg);color:var(--neg);font-size:18px}
.flag{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:10px;background:#f3f5f7;color:#36506f;font-size:12px;font-weight:700;cursor:pointer}
.flag input{width:17px;height:17px;margin:0;accent-color:#4e708d}
.add,.variableReset{border:0;border-radius:11px;padding:11px 13px;font-weight:700;margin-top:8px;margin-right:6px;background:var(--soft);color:var(--soft-ink)}

/* Réglages */
.settingsGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.settingCard{border:1px solid var(--line);background:#fffefa;border-radius:15px;padding:16px}
.settingCard h3{margin:0 0 6px;font-size:16px}
.settingCard p{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.45}
.settingCard label.field{display:block;margin:13px 0 5px;font-weight:700}
.settingCard input[type=text],.settingCard select,.settingCard input.num{width:100%;padding:12px;border:1px solid #ddd9d2;border-radius:10px;background:var(--field)}
.settingCard .primary{margin-top:15px}
.settingActions{display:flex;gap:9px;flex-wrap:wrap}
.fileLabel{display:inline-flex;align-items:center;border-radius:11px;padding:11px 14px;background:#f2ede6;color:#755f47;font-weight:700;cursor:pointer}
.fileLabel input{position:absolute;opacity:0;width:1px;height:1px}
.version{margin-top:16px;font-size:12px;color:var(--muted)}

/* Fenêtre et notifications */
.modal{position:fixed;inset:0;background:rgba(29,42,58,.35);display:none;place-items:center;padding:20px;z-index:20}
.modal.on{display:grid}
.modalbox{width:min(520px,100%);background:#fffefa;border-radius:20px;padding:20px;box-shadow:0 20px 60px rgba(29,42,58,.2)}
.modalbox h2{margin-top:0}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choice{border:1px solid #dcd8d1;background:#faf8f4;border-radius:14px;padding:15px 8px;font-weight:700;color:#17345f}
.close{float:right;border:0;background:#efede8;border-radius:10px;padding:7px 10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.toast.warn{background:var(--neg)}
.printdate{display:none}

/* Tablette */
@media(max-width:850px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .accounts,.charts,.settingsGrid{grid-template-columns:1fr}
  .header{align-items:flex-start}
  .brand h1{font-size:25px}
}
/* Mobile */
@media(max-width:700px){
  body{font-size:16px}
  .wrap{padding:10px;padding-bottom:max(22px,env(safe-area-inset-bottom))}
  .header{flex-wrap:wrap;gap:10px;margin-bottom:12px}
  .brand{width:100%}.brand h1{font-size:24px}.brand p{font-size:12px}
  .header .primary{width:100%;min-height:48px;font-size:15px}
  .nav{padding:6px;gap:6px;border-radius:15px;margin-bottom:14px}
  .nav button{min-height:44px;padding:10px 15px;font-size:14px}
  .stats,.stats.three{grid-template-columns:1fr 1fr;gap:9px}
  .stat{padding:12px;gap:8px;min-height:76px;border-radius:15px}
  .stat small{font-size:12px}.stat b{font-size:19px}
  .bubble{width:38px;height:38px;font-size:19px}
  .stats.three .stat:last-child{grid-column:1 / -1}
  .accounts{gap:13px;margin:14px 0}
  .acct,.panel,.section{border-radius:15px}
  .accthead{padding:15px 16px;font-size:17px}
  .acctbody{padding:14px}
  .mini{padding:13px 8px}.mini b{font-size:18px}
  .accountTitle{align-items:flex-start;flex-direction:column}
  .subnav{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .subnav button{min-height:44px;padding:9px 7px;font-size:13px}
  .row,.row.withflag{grid-template-columns:minmax(0,1fr) 46px;gap:8px;padding:10px;margin:9px 0;border:1px solid var(--line);border-radius:13px;background:#fffefa}
  .row>input:first-child{grid-column:1 / -1}
  .row>input{min-height:44px;font-size:16px}
  .row .money{grid-column:1;min-height:46px;font-size:17px;font-weight:700;text-align:left}
  .row .del{grid-column:2;grid-row:2;min-height:46px}
  .row .flag{grid-column:1 / -1;min-height:40px}
  .add,.variableReset{width:100%;min-height:46px;margin-right:0}
  .charts{gap:12px}
  .panel,.section{padding:15px}
  .panel h2,.section h2{font-size:17px}
  .chart{height:265px}
  .op{padding:12px 6px}
  .bottom{grid-template-columns:1fr;gap:10px}
  .bottom button{min-height:50px}
  .choices{grid-template-columns:1fr}
  .settingActions>*{width:100%;justify-content:center;text-align:center}
}
@media(max-width:380px){
  .wrap{padding-left:8px;padding-right:8px}
  .subnav{grid-template-columns:1fr}
  .brand h1{font-size:22px}
  .stat b{font-size:17px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* Impression / PDF */
@media print{
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .header .primary,.nav,.bottom,.modal,.toast,.feednote,.tabbar,.sheet,.confetti,.banner,.iconBtn,.acctSwitch{display:none!important}
  .hero{color:#000;background:#fff!important;border:1px solid #ccc;box-shadow:none}
  .stat,.panel,.acct,.section{box-shadow:none;break-inside:avoid}
  .page{display:none!important}#dashboard{display:block!important}
  .stats{grid-template-columns:repeat(4,1fr)!important}
  .charts{grid-template-columns:1fr 1fr!important}
  .accounts{grid-template-columns:repeat(3,1fr)!important}
  .printdate{display:block;margin:0 0 10px;color:var(--muted);font-size:12px}
  @page{size:A4;margin:10mm}
}

/* Sélecteur de couleurs */
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.themeBtn{border:2px solid var(--line);background:var(--field);border-radius:14px;padding:12px;text-align:left;font-weight:700}
.themeBtn.on{border-color:var(--navy);box-shadow:0 0 0 3px var(--soft)}
.themeBtn small{display:block;font-weight:400;color:var(--muted);margin-top:2px}
.swatches{display:flex;gap:5px;margin-bottom:8px}
.swatches i{width:22px;height:22px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.08)}

/* ===== v4 : confort tactile et iPhone ===== */
html{-webkit-tap-highlight-color:transparent}
button,.flag,.chip,label{touch-action:manipulation}
button:active{transform:scale(.97)}
.mobileOnly{display:none!important}
.headActions{display:flex;gap:10px;align-items:center}
.iconBtn{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);place-items:center;color:var(--soft-ink);padding:0}
.iconBtn svg,.tabbar svg,.ios-share svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconBtn svg{width:22px;height:22px}

/* Carte « reste du mois » */
.hero{display:grid;grid-template-columns:1fr auto;gap:22px;align-items:center;padding:24px;border-radius:24px;color:#fff;background:linear-gradient(135deg,var(--navy2),var(--navy));box-shadow:0 16px 36px rgba(38,62,87,.22);margin-bottom:16px;position:relative;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.09);z-index:-1}
.hero::after{content:"";position:absolute;left:-40px;bottom:-110px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.05);z-index:-1}
.hero small{opacity:.88;font-size:14px;font-weight:600}
.hero .big{font-size:44px;font-weight:800;letter-spacing:-.025em;margin:2px 0 6px;font-variant-numeric:tabular-nums;line-height:1.1}
.hero .line{font-size:14px;opacity:.9}
.hero.negative,.hero.negative .ring span{background:linear-gradient(135deg,#c08d7d,#8c594b)}
.ring{width:120px;height:120px;border-radius:50%;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.22) 0);display:grid;place-items:center}
.ring span{width:94px;height:94px;border-radius:50%;background:linear-gradient(135deg,var(--navy2),var(--navy));box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);display:grid;place-items:center;text-align:center}
.ring em{font-style:normal;font-size:12px;line-height:1.25;opacity:.95}
.ring b{display:block;font-size:23px}
.stats.dash{margin-bottom:0}

/* Bandeaux d'accueil */
.banner.install{background:linear-gradient(135deg,var(--soft),var(--surface))}
.banner .chip{padding:7px 12px}

/* Barre d'onglets mobile */
.tabbar{display:none}

/* Panneau du bas (ajout rapide, aide) */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(20,26,34,.4);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheetbox{width:min(560px,100%);max-height:92vh;max-height:92dvh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.18);animation:sheetUp .24s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetUp{from{transform:translateY(60px);opacity:.3}}
@media(min-width:701px){.sheet{align-items:center;padding:20px}.sheetbox{border-radius:24px;padding-bottom:22px}.grab{display:none}}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 10px}
.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheetHead h2{margin:0;font-size:20px}
.sheetHead .close{float:none}
.qa-modes{display:flex;width:100%;margin-bottom:12px}
.qa-modes button{flex:1;padding:10px 4px;white-space:nowrap;font-size:14px}
.sheetFoot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));margin:0 -18px calc(-20px - env(safe-area-inset-bottom));padding:6px 18px calc(16px + env(safe-area-inset-bottom));background:var(--surface);box-shadow:0 -10px 16px -12px rgba(0,0,0,.12)}
@media(min-width:701px){.sheetFoot{bottom:-22px;margin-bottom:-22px;padding-bottom:18px}}
.amountBox{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:0 0 4px;padding:16px 12px;border-radius:20px;background:var(--soft);cursor:text}
.amountBox input{width:2ch;max-width:85%;border:0;background:transparent;text-align:center;font-size:46px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;padding:0;min-width:0}
.amountBox input::placeholder{color:var(--muted);opacity:.5}
.amountBox input:focus{outline:none}
.amountBox span{font-size:30px;font-weight:800;color:var(--muted)}
.lbl{font-size:12px;font-weight:800;color:var(--muted);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--field);border-radius:999px;padding:10px 14px;font-weight:700;font-size:14px;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--navy2);background:var(--soft);color:var(--soft-ink);box-shadow:0 0 0 2px var(--soft)}
.chip small{font-weight:600;color:var(--muted);font-size:12px}
.qaLabel{width:100%;margin-top:10px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--field);font-size:16px}
.preview{margin:12px 2px 0;font-size:14px;color:var(--soft-ink);min-height:20px;line-height:1.4}
.bigBtn{width:100%;margin-top:14px;min-height:56px;font-size:17px;border-radius:16px}
.bigBtn:disabled{opacity:.45;box-shadow:none}

/* Aide à l'installation */
.steps{counter-reset:st;display:grid;gap:14px;margin:4px 0 16px;padding:0;list-style:none}
.steps li{counter-increment:st;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;font-size:15px;line-height:1.45}
.steps li::before{content:counter(st);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:800;font-size:15px}
.ios-share{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--soft);color:#0a7aff;vertical-align:-7px;margin:0 2px}
.ios-share svg{width:17px;height:17px}

/* Avatars */
.avatars{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.avatars button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--field);font-size:20px;padding:0}
.avatars button.on{border-color:var(--navy2);background:var(--soft);box-shadow:0 0 0 2px var(--soft)}

/* Toast avec action */
.toast{display:flex;align-items:center;gap:12px}
.toast button{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:9px;padding:6px 11px;font-weight:800}

/* Confettis */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(620deg);opacity:.7}}

@media(max-width:700px){
  .mobileOnly{display:grid!important}
  .seg.mobileOnly{display:flex!important}
  .nav{display:none}
  .header{flex-wrap:nowrap;align-items:center}
  .header .brand{width:auto;min-width:0}
  .header .brand h1{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .header .primary{display:none}
  .logo{width:42px;height:42px;font-size:12px;flex:none}
  .wrap{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;position:fixed;left:0;right:0;bottom:0;z-index:15;padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:var(--surface);background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line)}
  .tabbar button{border:0;background:none;display:grid;justify-items:center;gap:3px;padding:6px 0 2px;font-size:11px;font-weight:700;color:var(--muted)}
  .tabbar button svg{width:25px;height:25px}
  .tabbar button.on{color:var(--info)}
  .tabbar .plus span{width:58px;height:58px;margin-top:-28px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--navy2),var(--navy));box-shadow:0 8px 20px rgba(38,62,87,.32);border:4px solid var(--bg)}
  .tabbar .plus svg{width:28px;height:28px;stroke-width:2.6}
  .acctSwitch{width:100%;margin-bottom:14px}
  .acctSwitch button{flex:1;padding:10px 4px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hero{padding:20px 18px;gap:12px;border-radius:22px}
  .hero .big{font-size:34px}
  .hero .line{font-size:13px}
  .ring{width:94px;height:94px}.ring span{width:72px;height:72px}.ring b{font-size:18px}.ring em{font-size:11px}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom))}
  .banner{font-size:14px}
  .banner .actions{width:100%;justify-content:flex-end;flex-wrap:wrap}
}

/* ===================== v5 : design dynamique ===================== */
:root{--c1a:#2f5d8f;--c1b:#5f93cc;--c2a:#b06c45;--c2b:#e3a678;--c3a:#4f7a64;--c3b:#86b39a;--au1:#1f3550;--au2:#2f5d8f;--glowA:#6fa8e8;--glowB:#e6b07e;--glowC:#8fd0b0}
html[data-theme=rose]{--c1a:#b25f78;--c1b:#e59db0;--c2a:#c47f5e;--c2b:#efbf9c;--c3a:#806aa6;--c3b:#b9a5da;--au1:#7d4458;--au2:#b56e84;--glowA:#ffb3c7;--glowB:#ffd2b0;--glowC:#d5c2ff}
html[data-theme=sombre]{--c1a:#24456e;--c1b:#3f6fa6;--c2a:#6e4527;--c2b:#a26e45;--c3a:#2e5743;--c3b:#4f8a6c;--au1:#0f1824;--au2:#1d3655;--glowA:#3f7fd0;--glowB:#c08345;--glowC:#3fa57a}

body{font-feature-settings:"tnum" 1}
.panel{border-radius:22px;border-color:transparent;box-shadow:0 1px 2px rgba(20,30,45,.04),0 10px 30px rgba(20,30,45,.06)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.ph h2{margin:0;font-size:18px;letter-spacing:-.01em}
.panel .ph h2{font-size:17px}
#dashboard>.ph{margin:22px 4px 10px}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--soft-ink)}
.link{border:0;background:none;color:var(--info);font-weight:700;font-size:14px;padding:6px}

/* Bandeau principal « aurore » */
.aurora{position:relative;overflow:hidden;isolation:isolate;border-radius:28px;padding:20px 22px 18px;color:#fff;background:linear-gradient(150deg,var(--au2),var(--au1));box-shadow:0 18px 40px rgba(20,35,55,.25);margin-bottom:16px}
.aurora::before{content:"";position:absolute;inset:-40%;z-index:-1;background:radial-gradient(closest-side,var(--glowA),transparent 70%) 15% 20%/55% 55% no-repeat,radial-gradient(closest-side,var(--glowB),transparent 70%) 85% 30%/50% 50% no-repeat,radial-gradient(closest-side,var(--glowC),transparent 70%) 50% 90%/60% 60% no-repeat;opacity:.55;filter:blur(10px);animation:drift 16s ease-in-out infinite alternate}
.aurora.neg{--au1:#5a2c25;--au2:#9a5242;--glowA:#ff9f8a;--glowB:#ffc48a}
@keyframes drift{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(4%,-3%) rotate(8deg)}100%{transform:translate(-4%,3%) rotate(-6deg)}}
.au-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.au-month{font-size:13px;font-weight:700;opacity:.85;text-transform:capitalize}
.au-streak{font-size:13px;font-weight:800;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.au-main{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.au-txt small{font-size:14px;font-weight:700;opacity:.85}
.au-big{font-size:48px;font-weight:850;letter-spacing:-.035em;line-height:1.05;margin:2px 0 6px;font-variant-numeric:tabular-nums}
.au-day{font-size:14px;opacity:.92}
.au-day b{font-weight:800}
.au-ring{position:relative;width:118px;height:118px}
.au-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.au-ring circle{fill:none;stroke-width:11}
.ar-bg{stroke:rgba(255,255,255,.2)}
.ar-fg{stroke:#fff;stroke-linecap:round}
.au-ring span{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:11px;font-weight:700;opacity:.95}
.au-ring b{font-size:24px;font-weight:850;letter-spacing:-.02em}
.fill-ring{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1) .1s}
.ready .fill-ring{stroke-dashoffset:var(--off)}
.au-mood{display:flex;gap:10px;align-items:flex-start;margin:14px 0 12px;padding:11px 13px;border-radius:16px;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:14px;line-height:1.4;font-weight:600}
.au-mood span{font-size:20px;line-height:1}
.au-pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.apill{padding:9px 10px;border-radius:14px;background:rgba(0,0,0,.14);min-width:0}
.apill small{display:block;font-size:11px;opacity:.8;font-weight:700}
.apill b{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

/* Cartes de compte façon carte bancaire */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:14px}
.bankcard{all:unset;box-sizing:border-box;cursor:pointer;position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;gap:2px;padding:16px 18px;border-radius:22px;color:#fff;min-height:168px;box-shadow:0 12px 26px rgba(20,30,45,.18);transition:transform .2s}
.bankcard:active{transform:scale(.97)}
.bankcard:focus-visible{outline:3px solid var(--navy2);outline-offset:3px}
.bankcard::before,.bankcard::after{content:"";position:absolute;border-radius:50%;z-index:-1;background:rgba(255,255,255,.12)}
.bankcard::before{width:200px;height:200px;right:-70px;top:-90px}
.bankcard::after{width:140px;height:140px;right:30px;bottom:-90px;background:rgba(255,255,255,.07)}
.c-u1{background:linear-gradient(140deg,var(--c1a),var(--c1b))}
.c-u2{background:linear-gradient(140deg,var(--c2a),var(--c2b))}
.c-common{background:linear-gradient(140deg,var(--c3a),var(--c3b))}
.bc-top{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.bc-av{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:18px}
.bc-name{font-weight:800;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-go{font-size:24px;opacity:.7;line-height:1}
.bc-lbl{font-size:12px;font-weight:700;opacity:.82}
.bc-amt{font-size:30px;font-weight:850;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bc-bar{height:6px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden;margin:10px 0 8px}
.bc-bar i{display:block;height:100%;border-radius:6px;background:#fff}
.bc-foot{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;opacity:.9}
.fill{width:0;transition:width 1s cubic-bezier(.2,.8,.2,1) .15s}
.ready .fill{width:var(--w)}
.bankcard.big{cursor:default;min-height:0;margin-bottom:16px}
.bankcard.big .bc-amt{font-size:38px}

.dashGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.dashGrid .panel,#dashboard>.panel{margin-top:0}
#dashboard>.panel{margin-top:16px}

/* Catégories */
.cats{display:grid;gap:12px}
.cat{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center}
.cat-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:color-mix(in srgb,var(--c) 18%,transparent)}
.cat-row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.cat-row span{font-weight:700}
.cat-track{display:block;height:8px;border-radius:8px;background:var(--soft);margin-top:6px;overflow:hidden}
.cat-track i{display:block;height:100%;border-radius:8px;background:var(--c)}
.cat-pct{font-size:12px;font-weight:800;color:var(--muted);min-width:34px;text-align:right}

/* Objectifs (accueil) */
.gcard{all:unset;box-sizing:border-box;cursor:pointer;display:grid;justify-items:center;text-align:center;gap:4px;padding:14px 10px;border-radius:18px;background:var(--soft);min-width:0}
.gcard b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gcard small{font-size:12px;color:var(--muted);font-weight:600}
.gcard.done{background:var(--pos-bg)}
.gc-ring{position:relative;width:64px;height:64px;margin-bottom:4px}
.gc-em{position:absolute;inset:0;display:grid;place-items:center;font-size:24px}
.gring{transform:rotate(-90deg)}
.gring circle{fill:none;stroke-width:7}
.gr-bg{stroke:color-mix(in srgb,var(--navy2) 18%,transparent)}
.gr-fg{stroke:var(--navy2);stroke-linecap:round}
.gcard.done .gr-fg{stroke:var(--pos)}
.goalAdd{all:unset;box-sizing:border-box;cursor:pointer;display:grid;justify-items:center;text-align:center;gap:6px;width:100%;padding:22px 14px;border-radius:18px;border:2px dashed var(--line);color:var(--ink)}
.goalAdd span{font-size:30px}.goalAdd small{color:var(--muted);font-size:13px}

/* Trophées */
.badges{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}
.badge{display:grid;justify-items:center;text-align:center;gap:4px;padding:12px 6px;border-radius:16px;background:var(--soft);opacity:.45;filter:grayscale(1)}
.badge span{font-size:28px;line-height:1.1}
.badge b{font-size:12px;line-height:1.2}
.badge small{display:none}
.badge.on{opacity:1;filter:none;background:linear-gradient(160deg,var(--surface),var(--soft));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--navy2) 35%,transparent)}
.badge.on span{animation:shine 3s ease-in-out infinite}
@keyframes shine{0%,90%,100%{transform:scale(1)}95%{transform:scale(1.15) rotate(-6deg)}}

/* Activité */
.acts{display:grid}
.act{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:19px;background:var(--soft)}
.act-main{min-width:0}
.act-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.act-main small{color:var(--muted);font-size:12px}
.act-amt{text-align:right;font-weight:800;font-size:15px;white-space:nowrap}
.act-amt small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.act-amt.in{color:var(--pos)}

.toast{left:0;right:0;margin:0 auto;transform:none;width:fit-content;max-width:calc(100% - 32px)}
img.logo{object-fit:cover;padding:0;background:none}
/* Validation animée */
.pop{position:fixed;inset:0;z-index:70;display:grid;place-items:center;pointer-events:none}
.pop span{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:var(--pos);box-shadow:0 14px 40px rgba(0,0,0,.25);animation:popIn .9s cubic-bezier(.2,1.4,.4,1) forwards}
.pop svg{width:52px;height:52px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;animation:tick .35s .15s ease-out forwards}
@keyframes popIn{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.08);opacity:1}75%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:0}}
@keyframes tick{to{stroke-dashoffset:0}}

/* Objectifs (page) */
.ghead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.gemoji{width:44px;height:44px;flex:none;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:22px}
.ghead .gname{margin:0}
.goal{border-radius:22px;border-color:transparent;box-shadow:0 10px 30px rgba(20,30,45,.07)}

@media(max-width:850px){.badges{grid-template-columns:repeat(4,1fr)}}
@media(max-width:700px){
  .aurora{margin:-2px -2px 14px;border-radius:26px;padding:18px 18px 16px}
  .au-big{font-size:40px}
  .au-ring{width:96px;height:96px}.au-ring b{font-size:20px}
  .strip{grid-auto-columns:78%;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -10px;padding:4px 10px 12px;scrollbar-width:none;scroll-padding:0 10px}
  .strip::-webkit-scrollbar{display:none}
  .strip>*{scroll-snap-align:start}
  .panel .strip{grid-auto-columns:42%;margin:0 -15px;padding:2px 15px 4px;scroll-padding:0 15px}
  .dashGrid{grid-template-columns:1fr;gap:14px;margin-top:14px}
  #dashboard>.panel{margin-top:14px}
  .badges{grid-template-columns:repeat(4,1fr);gap:8px}
  .badge{padding:10px 4px}.badge span{font-size:24px}.badge b{font-size:11px}
  .bankcard.big .bc-amt{font-size:34px}
}
@media(prefers-reduced-motion:reduce){.aurora::before,.badge.on span{animation:none}.fill,.fill-ring{transition:none}}
@media print{.aurora{color:#000;background:#fff!important;border:1px solid #ccc;box-shadow:none}.aurora::before{display:none}.bankcard{color:#000;background:#fff!important;border:1px solid #ccc;box-shadow:none}.strip{display:grid!important;grid-auto-flow:row!important;grid-template-columns:repeat(3,1fr)!important}.badges,.goalAdd{display:none}.fill{width:var(--w)!important}.fill-ring{stroke-dashoffset:var(--off)!important}.ar-fg{stroke:#333}.ar-bg{stroke:#ddd}}

/* === Thème rose pâle === */
html[data-theme=rose]{--bg:#f9f1f2;--surface:#fffbfb;--ink:#3b2a31;--muted:#8a737c;--line:#eedfe2;--navy:#a86a7b;--navy2:#cd97a4;--pos:#5f8a72;--pos-bg:#eef5f0;--neg:#b0574c;--neg-bg:#fbede9;--info:#9b5f6f;--info-bg:#f9eaee;--lav:#7a6690;--lav-bg:#f3eef8;--soft:#f8e9ed;--soft-ink:#97586a;--shadow:0 8px 24px rgba(150,90,105,.07)}

html[data-theme=rose] .a2{background:linear-gradient(135deg,#fdf8f4,#f5e7dc)}
html[data-theme=rose] .ac{background:linear-gradient(135deg,#faf6fa,#eee4f0)}
html[data-theme=rose] .crown-u1{background:#f6e3e8;color:#a86a7b}
html[data-theme=rose] .crown-u2{background:#f5e7dc;color:#9a7055}
html[data-theme=rose] .crown-common{background:#eee4f0;color:#7a6690}

html[data-theme=rose] .hint{color:#957f88}

html[data-theme=rose] .empty{background:#fdf7f8;color:#8a737c}
html[data-theme=rose] .op{border-color:#f2e6e9}
html[data-theme=rose] .op small{color:#9a8790}
html[data-theme=rose] .pdf{background:#eef5f0;color:#5f8a72}

/* Bandeau de rappel */
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;margin:0 0 14px;border-radius:14px;background:var(--soft);color:var(--soft-ink);border:1px solid var(--line)}
.banner .actions{display:flex;gap:8px}
.banner button{border:0;border-radius:10px;padding:9px 12px;font-weight:700}
.banner .go{background:var(--navy);color:#fff}
.banner .later{background:transparent;color:inherit}

/* Tableaux */
.tablewrap{overflow-x:auto;margin:0 -4px}
.table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.table th:first-child,.table td:first-child{text-align:left}
.table th{font-size:12px;color:var(--muted);font-weight:700}
.table tfoot td{font-weight:800;border-bottom:0}
.table input{width:110px;border:1px solid var(--line);border-radius:9px;padding:7px 8px;text-align:right;background:var(--field);font-variant-numeric:tabular-nums}
.table .del{width:34px;height:34px}
.sm{display:none;font-weight:400;font-size:12px;color:var(--muted)}
.up{color:var(--neg);font-weight:700}.down{color:var(--pos);font-weight:700}

/* Interrupteur à deux choix */
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;margin:0 0 12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 12px;font-weight:700;color:var(--soft-ink)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.splitActions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:12px}
.callout{padding:11px 13px;border-radius:12px;background:var(--soft);color:var(--soft-ink);font-size:14px;line-height:1.45;margin:0 0 12px}
.callout.warn{background:var(--neg-bg);color:var(--neg)}
.callout.ok{background:var(--pos-bg);color:var(--pos)}

/* Objectifs d'épargne */
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:16px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);padding:16px}
.goal .gname{width:100%;border:1px solid transparent;border-radius:9px;background:transparent;font-weight:800;font-size:18px;padding:5px 6px;margin:-5px -6px 8px;color:var(--ink)}
.goal .gname:hover,.goal .gname:focus{border-color:var(--line);background:var(--field)}
.gfields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gfields label{font-size:12px;color:var(--muted);font-weight:700}
.gfields input{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:10px 8px;background:var(--field);font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.goal .bar{height:11px;margin-top:14px}
.goal.done .bar i{background:linear-gradient(90deg,#9cc2aa,var(--pos))}
.gmeta{display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.geta{margin:8px 0 0;font-size:13px;color:var(--soft-ink)}
.gactions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.gactions .danger{padding:9px 12px}
.minigoal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.minigoal:last-child{border-bottom:0}
.minigoal .bar{grid-column:1 / -1;margin-top:2px;height:7px}

/* Clôture */
.closeCard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:end}
.closeCard label.field{display:block;font-weight:700;font-size:14px;margin-bottom:5px}
.closeCard select,.closeCard input.num{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:16px}
.checks{grid-column:1 / -1;display:grid;gap:8px}
.checks .flag{font-size:13px;padding:10px 12px}

/* Écran de verrouillage */
html.locked .wrap{visibility:hidden}
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;place-items:center;padding:20px}
.lock.on{display:grid}
.lockbox{width:min(300px,100%);text-align:center}
.lockbox .logo{margin:0 auto 14px;width:58px;height:58px;font-size:15px}
.lockbox h2{margin:0;font-size:20px}
.lockbox p{margin:6px 0 0;color:var(--muted);font-size:14px}
.dots{display:flex;justify-content:center;gap:14px;margin:20px 0 8px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--navy);transition:background .1s}
.dots i.f{background:var(--navy)}
.lockerr{color:var(--neg);min-height:22px;font-size:14px;margin-bottom:10px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.keypad button{height:64px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:24px;font-weight:700;color:var(--ink)}
.keypad button:active{background:var(--soft)}
.keypad .ghost{border:0;background:transparent;font-size:20px}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;margin-top:18px;font-size:14px}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
@media(prefers-reduced-motion:reduce){.shake{animation:none}}

@media(max-width:700px){
  .closeCard{grid-template-columns:1fr}
  .gfields input{font-size:16px}
  .table{font-size:13px}
  .seg button{padding:8px 9px;font-size:14px}
  .table .hm{display:none}
  .table .sm{display:block}
  .table th,.table td{padding:9px 4px}
  .table input{width:80px}
}

<script>
'use strict';
const APP_VERSION='5.3';
const STORAGE_KEY='gestionCompteAPLC_prive_local_v1'; // inchangée : les données existantes sont conservées
const THEME_KEY='gestionCompteAPLC_theme';
const PIN_KEY='gestionCompteAPLC_pin';
const BACKUP_KEY='gestionCompteAPLC_lastBackup';
const SNOOZE_KEY='gestionCompteAPLC_backupSnooze';
const ME_KEY='gestionCompteAPLC_me';
const INSTALL_KEY='gestionCompteAPLC_installSnooze';
const LASTQA_KEY='gestionCompteAPLC_lastQuickAccount';
const ACCOUNTS=['u1','u2','common'];
const TYPES=['income','expense','variable','annual'];
const META={
  income:{tab:'💰 Revenus',add:'un revenu',kind:'Revenu',def:'Nouveau revenu'},
  expense:{tab:'🧾 Dépenses mensuelles',add:'une dépense',kind:'Dépense',def:'Nouvelle dépense'},
  variable:{tab:'🛒 Dépenses variables',add:'une dépense variable',kind:'Dépense variable',def:'Nouvelle dépense variable'},
  annual:{tab:'📅 Dépenses annuelles',add:'une dépense annuelle',kind:'Dépense annuelle',def:'Nouvelle dépense annuelle'}
};
const LS={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};

/* ---------- Données ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const blank=()=>({income:[],expense:[],variable:[],annual:[]});
const personal=()=>({income:[['Salaire','0']],expense:[['Compte commun','0',{feedCommon:true}],['Logement','0'],['Alimentation','0'],['Transport','0'],['Assurance','0'],['Autres','0']],variable:[['Courses','0'],['Sorties / loisirs','0']],annual:[['Impôts','0'],['Autres dépenses annuelles','0']]});
const fresh=()=>({version:7,names:{u1:'Utilisateur 1',u2:'Utilisateur 2'},u1:personal(),u2:personal(),
  common:{income:[],expense:[['Logement','0'],['Assurance maison','0'],['Électricité','0'],['Eau','0'],['Autres','0']],variable:[],annual:[]},
  operations:[],history:{},goals:[],months:{},settings:{split:'prorata'},avatars:{u1:'♔',u2:'♕'}});

// Remet n'importe quelle donnée (ancienne version, sauvegarde importée) dans un format sûr.
function normalize(d){
  if(!d||typeof d!=='object')return fresh();
  ACCOUNTS.forEach(a=>{
    if(!d[a]||typeof d[a]!=='object')d[a]=blank();
    TYPES.forEach(t=>{
      const list=Array.isArray(d[a][t])?d[a][t]:[];
      d[a][t]=list.filter(Array.isArray).map(x=>{
        const r=[String(x[0]??''),String(x[1]??'0')];
        if(x[2]&&typeof x[2]==='object')r.push(x[2]);
        return r;
      });
    });
  });
  if(!d.names||typeof d.names!=='object')d.names={};
  d.names.u1=String(d.names.u1||'Utilisateur 1');
  d.names.u2=String(d.names.u2||'Utilisateur 2');
  if(!Array.isArray(d.operations))d.operations=[];
  if(!d.history||typeof d.history!=='object')d.history={};

/* ---------- Calculs ---------- */
const fmt=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
const E=n=>fmt.format(Number(n)||0);
const signed=n=>(n>0?'+':'')+E(n);
// Accepte « 12,50 », « 1 200 » ou un petit calcul comme « 45+30 ».
function N(v){
  v=String(v??'0').replace(/,/g,'.').replace(/[\s\u00a0\u202f€]/g,'');
  if(!v||!/^[0-9+\-*/().]+$/.test(v))return 0;
  try{const r=Function('"use strict";return ('+v+')')();return Number.isFinite(r)?r:0}catch(e){return 0}
}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function flag(x,k){return !!(x&&x[2]&&typeof x[2]==='object'&&x[2][k])}
function sum(a,t){return data[a][t].reduce((s,x)=>s+N(x[1]),0)}
function commonPart(a){return data[a].expense.reduce((q,x)=>q+(flag(x,'feedCommon')?N(x[1]):0),0)}
function commonFeed(){return commonPart('u1')+commonPart('u2')}
function totals(a){const i=a==='common'?commonFeed():sum(a,'income'),e=sum(a,'expense')+sum(a,'variable')+sum(a,'annual')/12;return[i,e,i-e]}
function personalWithoutTransfer(a){return data[a].expense.reduce((s,x)=>s+(flag(x,'feedCommon')?0:N(x[1])),0)+sum(a,'variable')+sum(a,'annual')/12}
function all(){
  const revenus=totals('u1')[0]+totals('u2')[0];
  const depenses=personalWithoutTransfer('u1')+personalWithoutTransfer('u2')+totals('common')[1];
  return[revenus,depenses];
}
function title(a){return a==='u1'?data.names.u1:a==='u2'?data.names.u2:'Compte commun'}
function monthKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function monthLabel(k){const[y,m]=k.split('-').map(Number);const s=new Date(y,m-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1)}
function shiftMonth(k,n){const[y,m]=k.split('-').map(Number);return monthKey(new Date(y,m-1+n,1))}
function snapshot(){
  data.history[monthKey()]=all()[1];
  const keys=Object.keys(data.history).sort();
  while(keys.length>12)delete data.history[keys.shift()];
}

/* ---------- Répartition du compte commun ---------- */
function splitPlan(){
  const need=totals('common')[1],r1=totals('u1')[0],r2=totals('u2')[0],mode=data.settings.split;
  const s1=mode==='egal'||r1+r2<=0?.5:r1/(r1+r2);
  const e1=Math.ceil(need*s1),e2=Math.ceil(need*(1-s1));
  return{need,mode,rows:[['u1',r1,s1,e1,commonPart('u1')],['u2',r2,1-s1,e2,commonPart('u2')]]};
}
function splitHTML(){
  const p=splitPlan(),paid=p.rows[0][4]+p.rows[1][4],diff=paid-p.need;
  const seg=`<div class="seg" role="group" aria-label="Mode de répartition"><button class="${p.mode==='prorata'?'on':''}" data-action="split" data-mode="prorata">Au prorata des revenus</button><button class="${p.mode==='egal'?'on':''}" data-action="split" data-mode="egal">À parts égales</button></div>`;
  if(p.need<=0)return`${seg}<p class="callout">Saisissez les dépenses du compte commun (onglets ci-dessous) : la part de chacun sera calculée automatiquement.</p>`;
  const status=Math.abs(diff)<1?`<p class="callout ok">Les versements couvrent exactement les dépenses du compte commun.</p>`
    :diff<0?`<p class="callout warn">Il manque ${E(-diff)} par mois sur le compte commun avec les versements actuels.</p>`
    :`<p class="callout ok">Les versements dépassent les besoins de ${E(diff)} par mois : cet excédent s'accumule sur le compte commun.</p>`;
  return`${seg}${status}<div class="tablewrap"><table class="table">
  <thead><tr><th>Personne</th><th class="hm">Revenus</th><th class="hm">Part</th><th>À verser</th><th>Versé</th><th>Écart</th></tr></thead>
  <tbody>${p.rows.map(([a,r,s,e,v])=>`<tr><td>${esc(title(a))}<small class="sm">${Math.round(s*100)} % du besoin</small></td><td class="hm">${E(r)}</td><td class="hm">${Math.round(s*100)} %</td><td><b>${E(e)}</b></td><td>${E(v)}</td><td class="${v-e<-0.5?'up':v-e>0.5?'down':''}">${Math.abs(v-e)<0.5?'—':signed(v-e)}</td></tr>`).join('')}</tbody>
  <tfoot><tr><td>Besoin</td><td class="hm"></td><td class="hm"></td><td>${E(p.need)}</td><td>${E(paid)}</td><td></td></tr></tfoot>
  </table></div>
  <div class="splitActions"><span class="hint">Montants arrondis à l'euro supérieur. Les dépenses annuelles comptent pour 1/12.</span><button class="primary" data-action="applySplit">Appliquer ces versements</button></div>`;
}
function applySplit(){
  const p=splitPlan();
  if(p.need<=0)return;
  if(!confirm(`Mettre ${E(p.rows[0][3])} pour ${title('u1')} et ${E(p.rows[1][3])} pour ${title('u2')} dans la ligne « Transfert vers le compte commun » ?`))return;
  p.rows.forEach(([a,,,expected])=>{
    const list=data[a].expense;let idx=list.findIndex(x=>flag(x,'feedCommon'));
    if(idx<0){list.unshift(['Compte commun','0',{feedCommon:true}]);idx=0}
    const others=list.reduce((s,x,i)=>s+(i!==idx&&flag(x,'feedCommon')?N(x[1]):0),0);
    const val=String(Math.max(0,expected-others)),prev=list[idx][1];
    list[idx][1]=val;logOp(a,'expense',idx,prev,val);
  });
  save();render();toast('Versements mis à jour');
}

    const to=Number(el.dataset.count),key=el.dataset.key||'',from=key in lastCount?lastCount[key]:to*0.6;

    if(reduce||from===to){el.textContent=E(to);return}
    const t0=performance.now(),dur=800;
    const step=t=>{const p=Math.min(1,(t-t0)/dur),q=1-Math.pow(1-p,3);el.textContent=E(from+(to-from)*q);if(p<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}
function reveal(root){requestAnimationFrame(()=>requestAnimationFrame(()=>root.classList.add('ready')))}

function relDay(o){
  if(!o.ts)return o.date;
  const d=new Date(o.ts),t=new Date(),y=new Date();y.setDate(t.getDate()-1);
  const hm=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  if(dayKey(d)===dayKey(t))return"Aujourd'hui · "+hm;
  if(dayKey(d)===dayKey(y))return'Hier · '+hm;
  return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}

/* ---------- Objectifs d'épargne ---------- */
function goalInfo(g){
  const t=N(g.target),sv=N(g.saved),m=N(g.monthly),left=Math.max(0,t-sv),pct=t>0?Math.min(100,sv/t*100):0;
  let eta;
  if(t<=0)eta='Indiquez un montant à atteindre.';
  else if(left<=0)eta='🎉 Objectif atteint !';
  else if(m>0){const n=Math.ceil(left/m),d=new Date();d.setMonth(d.getMonth()+n);eta=`À ce rythme : atteint en ${d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})} (${n} mois).`}
  else eta='Indiquez un versement mensuel pour estimer la date.';
  return{t,sv,m,left,pct,eta,done:t>0&&left<=0};
}
function goalHTML(g){
  const k=goalInfo(g),ref=`data-g="${g.id}"`;
  return`<div class="goal ${k.done?'done':''}" id="goal-${g.id}">
  <div class="ghead"><span class="gemoji" id="gem-${g.id}">${goalEmoji(g.name)}</span><input class="gname" ${ref} data-gf="name" value="${esc(g.name)}" aria-label="Nom de l'objectif" maxlength="40"></div>

    <label>Déjà épargné<input ${ref} data-gf="saved" inputmode="decimal" value="${esc(g.saved)}"></label>
    <label>Par mois<input ${ref} data-gf="monthly" inputmode="decimal" value="${esc(g.monthly)}"></label>
  </div>
  <div class="bar"><i id="gbar-${g.id}" style="width:${k.pct}%"></i></div>
  <div class="gmeta" id="gmeta-${g.id}"><span>${Math.round(k.pct)} %</span><span>${k.left>0?'Reste '+E(k.left):''}</span></div>
  <p class="geta" id="geta-${g.id}">${k.eta}</p>

function goalsSummary(){

function updateGoal(g){
  const k=goalInfo(g),bar=$('gbar-'+g.id),meta=$('gmeta-'+g.id),eta=$('geta-'+g.id),card=$('goal-'+g.id);
  if(bar)bar.style.width=k.pct+'%';

const findGoal=id=>data.goals.find(g=>g.id===id);
function addGoal(){
  const g={id:uid(),name:'Nouvel objectif',target:'0',saved:'0',monthly:'0'};
  data.goals.push(g);save();renderGoals();
  const el=document.querySelector(`#goal-${g.id} .gname`);if(el){el.focus();el.select()}
}
function delGoal(id){
  const g=findGoal(id);if(!g||!confirm(`Supprimer l'objectif « ${g.name} » ?`))return;
  data.goals=data.goals.filter(x=>x.id!==id);save();renderGoals();toast('Objectif supprimé');
}
function goalDeposit(id){
  const g=findGoal(id);if(!g)return;const was=goalInfo(g).done;
  g.saved=String(Math.round((N(g.saved)+N(g.monthly))*100)/100);save();renderGoals();
  if(!was&&goalInfo(g).done){confetti();toast(`🎉 Objectif « ${g.name} » atteint !`)}else toast(`${E(N(g.monthly))} ajoutés à « ${g.name} »`);
}

/* ---------- Code d'accès ---------- */
const PIN_LEN=4,RELOCK_MS=2*60*1000;
let lockMode=null,pinBuf='',pinFirst='',pinFails=0,pinWaitUntil=0,hiddenAt=0;
async function hashPin(pin,salt){
  const s=salt+':'+pin;
  if(window.crypto&&crypto.subtle){
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return 'f'+(h>>>0).toString(16);
}
function storedPin(){try{return JSON.parse(LS.get(PIN_KEY)||'null')}catch(e){return null}}
const LOCK_TEXT={
  unlock:['Entrez votre code','',"Code oublié ?"],
  verifyChange:['Code actuel','Pour changer de code','Annuler'],
  verifyRemove:['Code actuel','Pour supprimer le code','Annuler'],
  set1:['Nouveau code','Choisissez 4 chiffres','Annuler'],
  set2:['Confirmez le code','Tapez-le une deuxième fois','Annuler']
};
function lockOpen(mode){
  lockMode=mode;pinBuf='';
  const[t,sub,alt]=LOCK_TEXT[mode];
  $('lockTitle').textContent=t;$('lockSub').textContent=sub;$('lockAlt').textContent=alt;$('lockErr').textContent='';
  $('lock').classList.add('on');drawDots();
}
function lockClose(){
  $('lock').classList.remove('on');lockMode=null;pinBuf='';
  document.documentElement.classList.remove('locked');
}
function drawDots(){$('dots').innerHTML=Array.from({length:PIN_LEN},(_,i)=>`<i class="${i<pinBuf.length?'f':''}"></i>`).join('')}
function lockError(msg){
  $('lockErr').textContent=msg;pinBuf='';drawDots();
  const d=$('dots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');
  if(navigator.vibrate)navigator.vibrate(80);
}
function pinKey(k){
  if(!lockMode)return;
  if(k==='back'){pinBuf=pinBuf.slice(0,-1);drawDots();return}
  if(pinWaitUntil>Date.now()){$('lockErr').textContent=`Trop d'essais. Réessayez dans ${Math.ceil((pinWaitUntil-Date.now())/1000)} s.`;return}
  if(pinBuf.length>=PIN_LEN)return;
  pinBuf+=k;drawDots();
  if(pinBuf.length===PIN_LEN)setTimeout(pinSubmit,120);
}
async function pinSubmit(){
  const code=pinBuf,mode=lockMode;
  if(mode==='set1'){pinFirst=code;lockOpen('set2');return}
  if(mode==='set2'){
    if(code!==pinFirst){pinFirst='';lockOpen('set1');lockError('Les deux codes ne correspondent pas. Recommencez.');return}
    const salt=uid();LS.set(PIN_KEY,JSON.stringify({salt,hash:await hashPin(code,salt)}));pinFirst='';
    lockClose();toast('Code d’accès activé');render();return;
  }
  const p=storedPin();if(!p){lockClose();return}
  if(await hashPin(code,p.salt)!==p.hash){
    pinFails++;
    if(pinFails>=5){pinWaitUntil=Date.now()+30000;pinFails=0;lockError('Trop d’essais. Patientez 30 secondes.')}
    else lockError('Code incorrect');
    return;
  }
  pinFails=0;
  if(mode==='unlock'){lockClose();requestAnimationFrame(drawCurrent)}
  else if(mode==='verifyChange')lockOpen('set1');
  else if(mode==='verifyRemove'){LS.del(PIN_KEY);lockClose();toast('Code d’accès supprimé');render()}
}
function lockAlt(){
  if(lockMode!=='unlock'){pinFirst='';lockClose();return}
  if(!confirm('Sans le code, la seule solution est d’effacer toutes les données de l’application sur cet appareil. Vous pourrez ensuite importer une sauvegarde. Continuer ?'))return;
  if(!confirm('Dernière confirmation : effacer définitivement les comptes de cet appareil ?'))return;
  LS.del(PIN_KEY);LS.del(STORAGE_KEY);data=fresh();save();lockClose();current='settings';render();toast('Données effacées. Vous pouvez importer une sauvegarde.');
}

/* ---------- Graphiques (canvas, sans bibliothèque) ---------- */
function setupCanvas(c){
  const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;
  c.width=Math.max(1,Math.round(r.width*d));c.height=Math.max(1,Math.round(r.height*d));
  const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.textBaseline='alphabetic';return[x,r];
}
function fitText(x,text,maxW){
  if(x.measureText(text).width<=maxW)return text;
  while(text.length>1&&x.measureText(text+'…').width>maxW)text=text.slice(0,-1);
  return text+'…';
}
function niceMax(m){const step0=Math.max(1,m*1.08)/4,mag=Math.pow(10,Math.floor(Math.log10(step0)));return[1,2,2.5,5,10].find(k=>k*mag>=step0)*mag*4}
function axisLabel(v){return v>=10000?(v/1000).toLocaleString('fr-FR',{maximumFractionDigits:0})+' k€':Math.round(v).toLocaleString('fr-FR')+' €'}
function grid(x,p,W,plotH,max){
  x.font='11px system-ui,sans-serif';x.lineWidth=1;
  for(let k=0;k<5;k++){const y=p.t+plotH*k/4;x.strokeStyle=T.grid;x.beginPath();x.moveTo(p.l,y);x.lineTo(W-p.r,y);x.stroke();x.fillStyle=T.muted;x.textAlign='right';x.fillText(axisLabel(max*(1-k/4)),p.l-6,y+4)}
}
function drawDonut(c,cats){
  if(!c)return;const[x,r]=setupCanvas(c),W=r.width,H=r.height;if(W<20)return;
  const items=Object.entries(cats).filter(([,v])=>v>0.004).sort((p,q)=>q[1]-p[1]);
  const total=items.reduce((s,[,v])=>s+v,0),narrow=W<440,ring=narrow?20:26;
  const R=narrow?Math.min(H*.3,W*.2):Math.min(H*.36,W*.17);
  const cx=narrow?R+ring/2+4:W*.25,cy=H/2;
  x.lineWidth=ring;
  if(!total){x.strokeStyle=T.grid;x.beginPath();x.arc(cx,cy,R,0,Math.PI*2);x.stroke()}
  else{
    let s=-Math.PI/2;const gap=items.length>1?0.02:0;
    items.forEach(([k,v])=>{const ang=v/total*Math.PI*2;x.strokeStyle=T.cats[k];x.beginPath();x.arc(cx,cy,R,s+gap/2,s+ang-gap/2);x.stroke();s+=ang});
  }
  x.textAlign='center';x.fillStyle=T.ink;x.font=`700 ${narrow?14:18}px system-ui,sans-serif`;
  x.fillText(fitText(x,E(total),R*2-ring-6),cx,cy+2);
  x.fillStyle=T.muted;x.font='12px system-ui,sans-serif';x.fillText('par mois',cx,cy+20);
  const lx=narrow?cx+R+ring/2+16:W*.5,maxW=W-lx-6;
  x.textAlign='left';
  if(!items.length){x.fillStyle=T.muted;x.font='13px system-ui,sans-serif';x.fillText(fitText(x,'Aucune dépense saisie',maxW),lx,cy+4);return}
  const rowH=Math.min(narrow?38:32,(H-12)/items.length);let y=cy-rowH*items.length/2+rowH/2;
  items.forEach(([k,v])=>{
    const pct=Math.round(v/total*100)+' %';
    x.fillStyle=T.cats[k];x.beginPath();x.arc(lx+5,narrow?y-5:y,5,0,Math.PI*2);x.fill();
    if(narrow){
      x.fillStyle=T.ink;x.font='13px system-ui,sans-serif';x.fillText(fitText(x,k,maxW-16),lx+16,y-1);
      x.fillStyle=T.muted;x.font='12px system-ui,sans-serif';x.fillText(fitText(x,E(v)+' · '+pct,maxW-16),lx+16,y+14);
    }else{
      x.font='700 13px system-ui,sans-serif';const amt=E(v),aw=x.measureText(amt).width;
      x.fillStyle=T.ink;x.textAlign='right';x.fillText(amt,W-8,y+4);
      x.font='13px system-ui,sans-serif';x.textAlign='left';
      x.fillText(fitText(x,k,maxW-aw-62),lx+16,y+4);
      x.fillStyle=T.muted;x.textAlign='right';x.fillText(pct,W-16-aw,y+4);x.textAlign='left';
    }
    y+=rowH;
  });
}
function drawBars(c,a){
  if(!c)return;const[x,r]=setupCanvas(c),W=r.width,H=r.height;if(W<20)return;
  const[inc,exp,bal]=totals(a),vals=[inc,exp,bal],labs=['Revenus','Dépenses','Solde'];
  const colors=[T.bars[0],T.bars[1],bal<0?T.bars[3]:T.bars[2]];
  const p={l:52,r:12,t:26,b:34},max=niceMax(Math.max(...vals.map(Math.abs))),plotH=H-p.t-p.b,plotW=W-p.l-p.r,bw=Math.min(64,plotW/5);
  grid(x,p,W,plotH,max);
  vals.forEach((v,i)=>{
    const cx=p.l+plotW*(i+.5)/3,h=plotH*Math.abs(v)/max;
    x.fillStyle=colors[i];x.fillRect(cx-bw/2,p.t+plotH-h,bw,h);
    x.textAlign='center';x.fillStyle=T.muted;x.font='12px system-ui,sans-serif';x.fillText(labs[i],cx,H-12);
    x.fillStyle=T.ink;x.font='700 12px system-ui,sans-serif';x.fillText(fitText(x,E(v),plotW/3-4),cx,Math.max(p.t-6,p.t+plotH-h-7));
  });
}
function drawLine(c){
  if(!c)return;const[x,r]=setupCanvas(c),W=r.width,H=r.height;if(W<20)return;
  const p={l:52,r:16,t:26,b:30},cur=monthKey(),keys=[],labels=[];
  for(let j=5;j>=0;j--){const k=shiftMonth(cur,-j);keys.push(k);const[y,m]=k.split('-').map(Number);labels.push(new Date(y,m-1,1).toLocaleDateString('fr-FR',{month:'short'}).replace('.',''))}
  const plan=keys.map((k,i)=>data.months[k]?N(data.months[k].depenses):i===5?all()[1]:(data.history[k]!=null?Number(data.history[k]):null));
  const real=keys.map(k=>data.months[k]&&String(data.months[k].real??'').trim()!==''?N(data.months[k].real):null);
  const known=[...plan,...real].filter(v=>v!=null),hasReal=real.some(v=>v!=null);
  const max=niceMax(Math.max(0,...known)),plotH=H-p.t-p.b,plotW=W-p.l-p.r;
  const X=i=>p.l+plotW*i/5,Y=v=>p.t+plotH*(1-v/max);
  grid(x,p,W,plotH,max);
  x.fillStyle=T.muted;x.textAlign='center';labels.forEach((m,i)=>x.fillText(m,X(i),H-10));
  const series=(vals,color,now)=>{
    x.strokeStyle=color;x.lineWidth=2.5;x.lineJoin='round';x.beginPath();let st=false;
    vals.forEach((v,i)=>{if(v==null)return;st?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v));st=true});x.stroke();
    vals.forEach((v,i)=>{if(v==null)return;x.fillStyle=now&&i===5?now:color;x.beginPath();x.arc(X(i),Y(v),now&&i===5?5:4,0,Math.PI*2);x.fill()});
  };
  series(plan,T.line,T.lineNow);
  if(hasReal)series(real,T.real);
  x.font='12px system-ui,sans-serif';x.textAlign='left';
  if(hasReal){
    const leg=[['Prévu',T.line],['Réel',T.real]];let lx=p.l;
    leg.forEach(([l,col])=>{x.fillStyle=col;x.fillRect(lx,p.t-17,14,3);x.fillStyle=T.muted;x.fillText(l,lx+19,p.t-12);lx+=x.measureText(l).width+40});
  }else if(plan.filter(v=>v!=null).length<2){x.fillStyle=T.muted;x.fillText(fitText(x,'La courbe se complète chaque mois où vous utilisez l’application.',plotW),p.l,p.t-10)}
}
function drawCharts(){drawDonut($('donut'),categoryTotals(ACCOUNTS,false));drawLine($('line'))}
function drawAccountCharts(a){drawDonut($('donut-'+a),categoryTotals([a],true));drawBars($('bars-'+a),a)}
function drawCurrent(){if(current==='dashboard')drawCharts();else if(ACCOUNTS.includes(current))drawAccountCharts(current)}
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(drawCurrent,120)});

/* ---------- Panneau du bas ---------- */
let sheetKind=null;
function openSheet(kind,titleTxt,html){
  sheetKind=kind;$('sheetTitle').textContent=titleTxt;$('sheetBody').innerHTML=html;
  $('sheet').classList.add('on');document.body.style.overflow='hidden';document.querySelector('.sheetbox').scrollTop=0;
}
function closeSheet(){$('sheet').classList.remove('on');document.body.style.overflow='';sheetKind=null;qa=null}

/* ---------- Ajout rapide ---------- */
const QA_SUGGEST={
  var:['Courses','Restaurant','Essence','Pharmacie','Vêtements','Cadeau','Enfants','Sorties'],
  fixed:['Abonnement','Assurance','Crédit','Téléphone','Internet','Électricité'],
  income:['Prime','Remboursement','Allocation','Vente','Salaire']
};
let qa=null;
function openQuickAdd(acct){
  const pref=acct||(ACCOUNTS.includes(current)?current:'')||me()||LS.get(LASTQA_KEY)||'u1';
  qa={mode:'var',a:ACCOUNTS.includes(pref)?pref:'u1',target:null,label:'',amount:''};
  openSheet('qa','Ajouter une dépense',qaHTML());qaUpdate();
  const el=$('qaAmount');if(el)el.focus(); // dans le geste de l'utilisateur : le clavier s'ouvre sur iPhone
}
function qaType(){return qa.mode==='var'?'variable':qa.mode==='fixed'?'expense':'income'}
function qaHTML(){
  const modes=[['var','🛒 Quotidien'],['fixed','🧾 Mensuelle'],['income','💰 Revenu']];
  const lines=qa.mode==='var'?data[qa.a].variable.map((x,i)=>[x,i]):[];
  const sugg=QA_SUGGEST[qa.mode].filter(x=>!lines.some(([r])=>r[0].trim().toLowerCase()===x.toLowerCase())).slice(0,qa.mode==='var'?5:6);
  const accts=ACCOUNTS.filter(x=>!(qa.mode==='income'&&x==='common'));
  const help={var:'Ajoute le montant au cumul du mois (courses, essence…).',fixed:'Une charge qui revient chaque mois (abonnement, crédit…).',income:'Un revenu en plus du salaire.'}[qa.mode];
  return`<div class="seg qa-modes" role="group" aria-label="Type">${modes.map(([m,l])=>`<button class="${qa.mode===m?'on':''}" data-action="qaMode" data-m="${m}">${l}</button>`).join('')}</div>
  <label class="amountBox"><input id="qaAmount" type="text" inputmode="decimal" placeholder="0" value="${esc(qa.amount)}" aria-label="Montant" enterkeyhint="done" autocomplete="off"><span>€</span></label>
  <p class="hint" style="text-align:center;margin:6px 0 0">${help}</p>
  <div class="lbl">Compte</div>
  <div class="chips">${accts.map(x=>`<button class="chip ${qa.a===x?'on':''}" data-action="qaAcct" data-a="${x}">${icon(x)} ${esc(title(x))}</button>`).join('')}</div>
  <div class="lbl">${qa.mode==='var'?'Pour quoi ?':'Libellé'}</div>
  <div class="chips">${lines.map(([x,i])=>`<button class="chip ${qa.target===i?'on':''}" data-action="qaLine" data-i="${i}">${esc(x[0])}<small>${E(N(x[1]))}</small></button>`).join('')}${sugg.map(x=>`<button class="chip ${qa.target==null&&qa.label===x?'on':''}" data-action="qaSuggest" data-s="${esc(x)}">${esc(x)}</button>`).join('')}</div>
  <input id="qaLabel" class="qaLabel" type="text" placeholder="${qa.mode==='var'?'Ou écrivez autre chose…':'Libellé, ex. Netflix'}" value="${qa.target==null?esc(qa.label):''}" maxlength="40" autocomplete="off" enterkeyhint="done">
  <div class="sheetFoot"><p class="preview" id="qaPreview" aria-live="polite"></p>
  <button class="primary bigBtn" id="qaSubmit" data-action="qaSubmit">Ajouter</button></div>`;
}
function qaRender(){const sb=$('sheetBody'),st=sb.scrollTop;sb.innerHTML=qaHTML();sb.scrollTop=st;qaUpdate()}
function qaLabelNow(){if(qa.target!=null){const r=data[qa.a].variable[qa.target];return r?r[0]:''}return qa.label.trim()}
function qaExisting(){
  if(qa.mode!=='var')return null;if(qa.target!=null)return qa.target;
  const l=qa.label.trim().toLowerCase();if(!l)return null;
  const i=data[qa.a].variable.findIndex(x=>x[0].trim().toLowerCase()===l);return i<0?null:i;
}
function qaUpdate(){
  const btn=$('qaSubmit'),pv=$('qaPreview');if(!btn||!qa)return;
  const inp=$('qaAmount');if(inp)inp.style.width=Math.max(1,(inp.value||inp.placeholder).length)+0.6+'ch';
  const amt=N(qa.amount),label=qaLabelNow(),ok=amt>0&&!!label;
  btn.disabled=!ok;
  btn.textContent=amt>0?`Ajouter ${E(amt)}`:'Saisissez un montant';
  let t='';
  if(amt>0&&!label)t=qa.mode==='var'?'Choisissez à quoi correspond cette dépense.':'Indiquez un libellé.';
  else if(ok){
    const ex=qaExisting();
    if(ex!=null){const r=data[qa.a].variable[ex];t=`« ${r[0]} » passera de ${E(N(r[1]))} à ${E(N(r[1])+amt)} ce mois-ci.`}
    else t=qa.mode==='var'?`Nouvelle dépense « ${label} » sur ${title(qa.a)}, remise à 0 à la clôture du mois.`
      :qa.mode==='fixed'?`Nouvelle charge mensuelle « ${label} » sur ${title(qa.a)}.`:`Nouveau revenu « ${label} » pour ${title(qa.a)}.`;
  }
  pv.textContent=t;
}
function qaSubmit(){
  if(!qa)return;
  const amt=Math.round(N(qa.amount)*100)/100,label=qaLabelNow();if(!(amt>0)||!label)return;
  const before=JSON.stringify(data),a=qa.a,t=qaType();let msg;
  if(t==='variable'){
    const ex=qaExisting();
    if(ex!=null){const r=data[a].variable[ex],prev=r[1];r[1]=String(Math.round((N(r[1])+amt)*100)/100);logOp(a,t,ex,prev,r[1]);msg=`${E(amt)} ajoutés à « ${r[0]} »`}
    else{data[a].variable.push([label,String(amt),{resetZero:true}]);logOp(a,t,data[a].variable.length-1,'0',String(amt));msg=`« ${label} » ajouté (${E(amt)})`}
  }else{data[a][t].push([label,String(amt)]);logOp(a,t,data[a][t].length-1,'0',String(amt));msg=`« ${label} » ajouté (${E(amt)})`}
  LS.set(LASTQA_KEY,a);
  if(current===a)accountTab[a]=t;
  save();closeSheet();render();successPop();
  toast(msg,false,{label:'Annuler',fn:()=>{data=normalize(JSON.parse(before));save();render();toast('Ajout annulé')}});
}

/* ---------- Installation sur l'écran d'accueil ---------- */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(current==='dashboard'||current==='settings')render()});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;toast('Appli installée');render()});
function platform(){
  const ua=navigator.userAgent||'';
  const ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const standalone=navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
  const otherBrowser=ios&&/CriOS|FxiOS|EdgiOS|OPiOS|GSA\/|Instagram|FBAN|FBAV|Snapchat|Messenger|LinkedInApp|Line\//.test(ua);
  return{ios,standalone,otherBrowser};
}
function installBanner(){
  const p=platform(),snooze=Date.parse(LS.get(INSTALL_KEY)||'');
  if(p.standalone||(snooze&&snooze>Date.now())||!(p.ios||deferredPrompt))return'';
  return`<div class="banner install" role="status"><span>📲 <b>Installez l'appli sur ${p.ios?'votre iPhone':'votre téléphone'}</b> : elle s'ouvrira en plein écran depuis son icône, comme une vraie application.</span><span class="actions"><button class="later" data-action="installLater">Plus tard</button><button class="go" data-action="install">${deferredPrompt?'Installer':'Comment faire ?'}</button></span></div>`;
}
async function install(){
  if(deferredPrompt){deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;render();return}
  const p=platform(),[i,e]=all(),hasData=i+e>0;
  const first=p.otherBrowser
    ?`<li><div>Ouvrez cette page dans <b>Safari</b> (l'appli à la boussole bleue) : l'installation ne fonctionne pas depuis ce navigateur. <br><button class="chip" style="margin-top:8px" data-action="copyLink">🔗 Copier le lien</button> puis collez-le dans Safari.</div></li>`:'';
  const html=p.ios||!deferredPrompt?`
    <ol class="steps">${first}
      <li><div>Touchez le bouton <b>Partager</b> <span class="ios-share">${svg('share')}</span>. Il est en bas de l'écran ; sur les iPhone récents, touchez d'abord <b>•••</b> puis <b>Partager</b>.</div></li>
      <li><div>Faites défiler la liste et choisissez <b>Sur l'écran d'accueil</b>.</div></li>
      <li><div>Laissez <b>Ouvrir comme app web</b> activé s'il apparaît, puis touchez <b>Ajouter</b>.</div></li>
      <li><div>Ouvrez l'appli avec l’icône <b>Gestion budget</b> qui apparaît sur l'écran d'accueil.</div></li>
    </ol>
    <p class="callout">Si « Sur l'écran d'accueil » n'apparaît pas, vérifiez que Safari n'est pas en <b>navigation privée</b>.</p>
    ${hasData?`<p class="callout warn"><b>Important :</b> l'appli installée ne voit pas les comptes saisis ici dans Safari. Exportez une sauvegarde maintenant, puis dans l'appli installée : Paramètres → Importer une sauvegarde.</p><button class="primary bigBtn" data-action="export">💾 Exporter une sauvegarde</button>`:''}`
    :'';
  openSheet('install','Installer l’appli',html);
}
function copyLink(){
  const url=location.href.split('#')[0];
  if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('Lien copié'),()=>prompt('Copiez ce lien :',url));
  else prompt('Copiez ce lien :',url);
}
function whoBanner(){
  if(LS.get(ME_KEY)!==null)return'';
  return`<div class="banner" role="status"><span>👋 <b>Qui utilise ce téléphone ?</b> L'appli vous saluera et proposera votre compte en premier.</span><span class="actions">${['u1','u2'].map(x=>`<button class="chip" data-action="setMe" data-me="${x}">${icon(x)} ${esc(title(x))}</button>`).join('')}<button class="later" data-action="setMe" data-me="none">Passer</button></span></div>`;
}

/* ---------- Confettis ---------- */
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('div');c.className='confetti';c.setAttribute('aria-hidden','true');
  const cols=Object.values(T.cats).slice(0,5);
  for(let k=0;k<70;k++){
    const s=document.createElement('i');
    s.style.left=Math.random()*100+'%';s.style.background=cols[k%cols.length];
    s.style.animationDelay=(Math.random()*.45)+'s';s.style.animationDuration=(1.2+Math.random()*1)+'s';
    s.style.transform=`rotate(${Math.random()*360}deg)`;c.appendChild(s);
  }
  document.body.appendChild(c);setTimeout(()=>c.remove(),2800);
}

markActivity();snapshot();LS.set(STORAGE_KEY,JSON.stringify(data));render();
if(storedPin())lockOpen('unlock');else document.documentElement.classList.remove('locked');
if('serviceWorker' in navigator&&location.protocol==='https:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
