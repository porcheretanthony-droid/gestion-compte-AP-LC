/* Palette claire et apaisée — bleu ciel, menthe, abricot, lavande */
:root{
  --ink:#20324f;
  --muted:#718096;
  --bg:#f7f9fc;
  --card:#ffffff;
  --line:#e6ebf2;
  --primary:#5b8def;
  --primary2:#79a7f5;
  --mint:#dff5ea;
  --mint-ink:#267a56;
  --rose:#fae8e9;
  --rose-ink:#a5525c;
  --sky:#e6f1ff;
  --sky-ink:#3f72b5;
  --lav:#eee9fb;
  --lav-ink:#705fa7;
  --apricot:#fff0dc;
  --apricot-ink:#9a6b35;
}
body{background:linear-gradient(145deg,#fbfcfe 0%,#f6f9fc 55%,#faf8fc 100%);color:var(--ink)}
.logo,.primary,.nav button.on{
  background:linear-gradient(135deg,var(--primary2),var(--primary));
  box-shadow:0 7px 18px rgba(91,141,239,.16)
}
.stat,.panel,.acct,.section{
  border-color:var(--line);
  box-shadow:0 8px 24px rgba(49,74,110,.065)
}
.stat.green{background:linear-gradient(135deg,#f7fdf9,var(--mint));color:var(--mint-ink)}
.stat.red{background:linear-gradient(135deg,#fffafa,var(--rose));color:var(--rose-ink);box-shadow:0 8px 24px rgba(165,82,92,.07)}
.stat.blue{background:linear-gradient(135deg,#f8fbff,var(--sky));color:var(--sky-ink)}
.stat.purple{background:linear-gradient(135deg,#fcfaff,var(--lav));color:var(--lav-ink)}
.a1{background:linear-gradient(135deg,#f4f9ff,#dcecff)}
.a2{background:linear-gradient(135deg,#fffaf2,var(--apricot))}
.ac{background:linear-gradient(135deg,#faf8ff,var(--lav))}
.saldo{background:linear-gradient(135deg,#f7fbff,#e8f2ff);color:#4776b6}
.bar{background:#edf1f6}.bar i{background:linear-gradient(90deg,#9bc0f8,#6d9bef)}
.add,.variableReset{background:#edf5ff;color:#4c73aa}
.feednote{background:linear-gradient(135deg,#f8fbff,#eef5ff);color:#526d91;border-color:#dce8f7}
.reset{background:#eaf3ff;color:#4a73ad}.pdf{background:#e8f7ef;color:#37795c}
.del,.danger{background:#fbecee;color:#a95560}
.nav{box-shadow:0 3px 14px rgba(49,74,110,.05)}


/* === ÉDITION QUOTIDIENNE PREMIUM === */
:root{
 --bg:#f5f7fa;--surface:#ffffff;--ink:#17243b;--muted:#718096;--line:#e7ebf1;
 --navy:#334e68;--blue:#5e83b6;--blue-soft:#edf3fa;
 --sage:#6f9b86;--sage-soft:#edf6f1;
 --rose:#a9787f;--rose-soft:#f8eff0;
 --champagne:#b29168;--champagne-soft:#f8f2e9;
 --lav:#81769f;--lav-soft:#f2eff7;
}
body{background:linear-gradient(145deg,#fafbfc 0%,#f4f7fa 52%,#f8f6f7 100%);color:var(--ink)}
.wrap{max-width:1200px}
.logo{background:linear-gradient(145deg,#55779f,#334e68);box-shadow:0 9px 24px rgba(51,78,104,.16)}
.primary{background:linear-gradient(135deg,#607fa7,#405f83);box-shadow:0 8px 22px rgba(64,95,131,.16)}
.nav{border-color:var(--line);box-shadow:0 5px 18px rgba(37,55,80,.045)}
.nav button.on{background:linear-gradient(135deg,#607fa7,#405f83);box-shadow:0 6px 16px rgba(64,95,131,.13)}
.stat,.panel,.acct,.section{border-color:var(--line);box-shadow:0 8px 28px rgba(30,48,72,.055)}
.stat.green{background:linear-gradient(135deg,#f9fcfa,var(--sage-soft));color:#4e7c67}
.stat.red{background:linear-gradient(135deg,#fdfafa,var(--rose-soft));color:#8d5d65;box-shadow:0 8px 28px rgba(100,70,76,.05)}
.stat.blue{background:linear-gradient(135deg,#fbfdff,var(--blue-soft));color:#486d9a}
.stat.purple{background:linear-gradient(135deg,#fcfbfd,var(--lav-soft));color:#675d86}
.a1{background:linear-gradient(135deg,#f4f8fc,#e4edf7)}
.a2{background:linear-gradient(135deg,#fcf8f3,#f3e9dd)}
.ac{background:linear-gradient(135deg,#faf9fc,#ece9f2)}
.saldo{background:linear-gradient(135deg,#f8fafc,#edf3f8);color:#486786}
.bar{background:#edf0f4}.bar i{background:linear-gradient(90deg,#a8bbd1,#6f8faf)}
.add,.variableReset{background:#edf3f8;color:#4c6989}
.feednote{background:linear-gradient(135deg,#fafbfc,#f1f4f8);color:#5b6f87;border-color:#e1e7ef}
.reset{background:#edf3f8;color:#4c6989}.pdf{background:#edf6f1;color:#527b67}
.del,.danger{background:#f8eff0;color:#8d5d65}
.accthead{letter-spacing:-.01em}
.crownmark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;margin-right:8px;font-size:17px;vertical-align:middle}
.crown-u1{background:#e9f0f8;color:#4f7097}
.crown-u2{background:#f5ede4;color:#987957}
.crown-common{background:#efedf4;color:#73698d}
@media(max-width:560px){
 .wrap{padding:10px}.header{margin-bottom:12px}.nav{margin-bottom:14px}
 .acct,.panel,.section,.stat{border-radius:15px}.brand h1{font-size:24px}
}


/* === MOBILE : cartes plus lisibles et faciles à toucher === */
@media(max-width:700px){
  body{font-size:16px}
  .wrap{padding:10px 10px 22px}
  .header{gap:10px}
  .brand{width:100%}
  .brand p{font-size:12px}
  .header .primary{min-height:48px;font-size:15px}
  .nav{padding:6px;gap:6px;border-radius:15px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{min-height:44px;padding:10px 15px;font-size:14px}

  /* Totaux : une vraie carte par ligne pour éviter l'effet tassé */
  .stats{grid-template-columns:1fr!important;gap:10px}
  .stat{min-height:76px;padding:14px 16px;border:1px solid #dfe5ed}
  .stat small{font-size:13px}
  .stat b{font-size:23px}
  .bubble{width:44px;height:44px}

  /* Comptes */
  .accounts{grid-template-columns:1fr;gap:13px;margin:14px 0}
  .acct{border:1px solid #dfe5ed}
  .accthead{padding:15px 16px;font-size:17px}
  .acctbody{padding:14px}
  .twocol{gap:9px}
  .mini{padding:13px 8px}
  .mini b{font-size:18px}
  .saldo{padding:13px}

  /* Pages utilisateur */
  .accountTitle{align-items:flex-start;flex-direction:column}
  .accountTitle .primary{width:100%}
  .subnav{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .subnav button{min-height:44px;padding:9px 7px;font-size:13px}

  /* Champs : libellé en haut, montant + suppression en dessous */
  .row,.row.withflag{
    grid-template-columns:minmax(0,1fr) 42px;
    gap:8px;
    padding:10px;
    margin:9px 0;
    border:1px solid #e2e7ee;
    border-radius:13px;
    background:#fbfcfd;
  }
  .row input:first-child{grid-column:1 / -1}
  .row .money{grid-column:1;min-height:46px;font-size:17px;font-weight:700;text-align:left}
  .row .del{grid-column:2;grid-row:2;min-height:46px}
  .row .flag{grid-column:1 / -1;grid-row:auto;min-height:40px}
  .row input{min-height:44px;font-size:16px}
  .add,.variableReset{width:100%;min-height:46px}

  /* Graphiques : pleine largeur */
  .charts,.formgrid{grid-template-columns:1fr;gap:12px}
  .panel,.section{padding:15px}
  .panel h2,.section h2{font-size:17px}
  .chart{height:265px;min-width:0}
  canvas{max-width:100%}

  /* Opérations et actions */
  .op{grid-template-columns:minmax(0,1fr) auto;padding:12px 8px}
  .bottom{grid-template-columns:1fr;gap:10px}
  .bottom button{min-height:50px}
}
@media(max-width:380px){
  .wrap{padding-left:8px;padding-right:8px}
  .subnav{grid-template-columns:1fr}
  .chart{height:245px}
  .brand h1{font-size:22px}
}

 --warm-blue:#55779a;
 --warm-sage:#718b7b;

 background:
   radial-gradient(circle at 15% 0%,rgba(194,164,125,.10),transparent 28%),
   linear-gradient(180deg,#f7f5f1 0%,var(--warm-bg) 100%);

}
.wrap{max-width:1200px}
.header{padding:4px 2px}

.a2{background:linear-gradient(135deg,#fbf8f3,#f1e8dc)}
.ac{background:linear-gradient(135deg,#f9f8f7,#ebe8e6)}
.saldo{background:linear-gradient(135deg,#f8fafb,#eaf0f4);color:#425f79}
.bar{background:#e8e5df}.bar i{background:linear-gradient(90deg,#7893aa,#4e708d)}
.add,.variableReset{background:#eaf0f4;color:#425f79}
.feednote{background:#f5f3ef;color:#5e6670;border-color:#e2ddd5}
.reset{background:#ebeef0;color:#425f79}
.pdf{background:#e9f0eb;color:#526e5d}
.del,.danger{background:#f5e9e5;color:#8c594b}

.crown-u2{background:#f2e9df;color:#8a6c4d}

input,select{color:var(--warm-ink)}
.row input{border-color:#ddd9d2;background:#fff}
@media(max-width:700px){

 .row,.row.withflag{background:#fffefa;border-color:#dedbd5}

<script>

const STORAGE_KEY='gestionCompteAPLC_prive_local_v1';let data;try{data=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch(e){} if(!data)data=fresh();['u1','u2','common'].forEach(a=>{if(!data[a])data[a]=blank();['income','expense','variable','annual'].forEach(t=>{if(!Array.isArray(data[a][t]))data[a][t]=[]})});if(!data.names)data.names={u1:'Utilisateur 1',u2:'Utilisateur 2'};if(!data.operations)data.operations=[];if(!data.history)data.history={};
['u1','u2'].forEach(a=>{let row=(data[a].expense||[]).find(x=>String(x[0]).toLowerCase().includes('compte commun'));if(!row){data[a].expense.unshift(['Compte commun','0',{feedCommon:true}])}else{if(!row[2]||typeof row[2]!=='object')row[2]={};row[2].feedCommon=true}});

const E=n=>Number(n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});function N(v){v=String(v??'0').replace(/,/g,'.').replace(/\s/g,'');if(!v)return 0;if(!/^[0-9+\-*/().]+$/.test(v))return 0;try{return Number(Function('"use strict";return ('+v+')')())||0}catch(e){return 0}}function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function accountPage(a){let[i,e,s]=totals(a),tab=accountTab[a]||'expense',meta={income:['💰 Revenus','revenu'],expense:['🧾 Dépenses mensuelles','dépense'],variable:['🛒 Dépenses variables','dépense variable'],annual:['📅 Dépenses annuelles','dépense annuelle']};document.getElementById(a).innerHTML=`<div class="accountTitle"><h2>${esc(title(a))}</h2>${a!=='common'?`<button class="primary" onclick="go('settings')">Modifier le nom</button>`:''}</div><div class="stats" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px"><div class="stat green"><div><small>Revenus</small><b>${E(i)}</b></div></div><div class="stat red"><div><small>Dépenses</small><b>${E(e)}</b></div></div><div class="stat blue"><div><small>Solde</small><b>${E(s)}</b></div></div></div><div class="charts" style="margin-bottom:18px"><div class="panel"><h2>▥ &nbsp; Répartition des dépenses</h2><div class="chart"><canvas id="donut-${a}"></canvas></div></div><div class="panel"><h2>▥ &nbsp; Revenus / dépenses / solde</h2><div class="chart"><canvas id="bars-${a}"></canvas></div></div></div><div class="section"><div class="subnav">${Object.keys(meta).map(t=>`<button class="${tab===t?'on':''}" onclick="setTab('${a}','${t}')">${meta[t][0]}</button>`).join('')}</div><h2>${meta[tab][0]}</h2>${tab==='annual'?'<p class="hint annualNote">Saisissez le montant annuel : il est automatiquement divisé par 12 dans le budget mensuel.</p>':''}${a==='common'&&tab==='income'?`<div class="feednote"><b>Versements mensuels vers le compte commun</b><br>Ces montants proviennent automatiquement de la dépense mensuelle « Compte commun » de chaque utilisateur.</div><div class="row"><input value="${esc(data.names.u1)}" disabled><input class="money" value="${E(commonPart('u1'))}" disabled><span></span></div><div class="row"><input value="${esc(data.names.u2)}" disabled><input class="money" value="${E(commonPart('u2'))}" disabled><span></span></div>`:rows(a,tab)}${a==='common'&&tab==='income'?'':`<button class="add" onclick="add('${a .kpi{padding:4mm;border:1px solid #dedbd5;border-radius:3mm;background:#faf9f6}.kpi small{display:block;color:#7b838a;text-transform:uppercase;font-size:7.5pt;letter-spacing:.04em}.kpi b{display:block;font-size:17pt;margin-top:1.5mm;color:#263e57}.kpi.exp b{color:#9a6250}.kpi.sol b{color:#55779a}
h2{font-size:12pt;color:#263e57;margin:5mm 0 2.5mm}.accounts{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}.account{border:1px solid #dedbd5;border-radius:3mm;overflow:hidden;break-inside:avoid}.account h3{margin:0;padding:3mm;background:#f1efe9;font-size:10pt}.nums{display:grid;grid-template-columns:1fr 1fr;gap:2mm;padding:3mm}.nums span{font-size:7.5pt;color:#77818a}.nums b{display:block;color:#243240;font-size:10pt;margin-top:1mm}.balance{border-top:1px solid #ece8e1;padding:2.5mm 3mm;color:#77818a;font-size:8pt}.balance b{float:right;color:#263e57;font-size:10pt}
.twocol{display:grid;grid-template-columns:1.05fr .95fr;gap:5mm;margin-top:5mm}.box{border:1px solid #dedbd5;border-radius:3mm;padding:4mm;break-inside:avoid}.box h2{margin:0 0 3mm}
.barrow{display:grid;grid-template-columns:25mm 1fr 25mm;gap:2mm;align-items:center;margin:2.4mm 0;font-size:8pt}.barrow i{height:3.5mm;background:#ece9e3;border-radius:2mm;overflow:hidden}.barrow i b{display:block;height:100%;background:#718b7b}.barrow strong{text-align:right}
table{width:100%;border-collapse:collapse;font-size:8.2pt}th{text-align:left;color:#7b838a;border-bottom:1px solid #d8d5cf;padding:2mm 1mm}th:last-child,td:last-child{text-align:right}td{padding:1.8mm 1mm;border-bottom:1px solid #eeece7}
.detail{break-inside:avoid;margin-top:4mm;border:1px solid #dedbd5;border-radius:3mm;padding:3.5mm}.detail h2{margin:0 0 2mm}.note{margin-top:5mm;padding:3mm 4mm;background:#f7f5f1;border-radius:2.5mm;color:#6f777e;font-size:7.8pt;line-height:1.45}.muted{color:#7b838a}
footer{border-top:1px solid #dedbd5;margin-top:5mm;padding-top:2.5mm;text-align:center;color:#92979c;font-size:7pt}
.screenOnly{display:flex;justify-content:center;margin:7mm 0}.screenOnly button{border:0;border-radius:9px;background:#263e57;color:#fff;padding:12px 20px;font-size:16px;font-weight:700}
@media print{.screenOnly{display:none!important}.report{max-width:none}body{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style></head><body><main class="report">
<header><div><h1>Gestion compte AP-LC</h1><p>Rapport mensuel</p></div><div class="date">${date}</div></header>
<div class="summary"><div class="kpi"><small>Revenus du foyer</small><b>${E(ri)}</b></div><div class="kpi exp"><small>Dépenses réelles</small><b>${E(de)}</b></div><div class="kpi sol"><small>Solde disponible</small><b>${E(solde)}</b></div></div>
<h2>Synthèse des comptes</h2><div class="accounts">${card('u1')}${card('u2')}${card('common')}</div>
<div class="twocol"><div class="box"><h2>Répartition des dépenses</h2>${bars||'<p class="muted">Aucune dépense.</p>'}</div>
<div class="box"><h2>Compte commun</h2><table><tbody><tr><td>${esc(data.names.u1)}</td><td>${E(commonPart('u1'))}</td></tr><tr><td>${esc(data.names.u2)}</td><td>${E(commonPart('u2'))}</td></tr><tr><td><b>Total versé</b></td><td><b>${E(commonFeed())}</b></td></tr><tr><td>Dépenses</td><td>${E(totals('common')[1])}</td></tr><tr><td><b>Solde</b></td><td><b>${E(totals('common')[2])}</b></td></tr></tbody></table></div></div>
<h2>Détail mensuel</h2>${table('u1')}${table('u2')}${table('common')}
<div class="note"><b>Calcul global :</b> les versements vers le compte commun sont des transferts internes. Ils restent visibles dans les comptes personnels mais ne sont pas comptés deux fois dans les dépenses du foyer. Les dépenses annuelles sont ramenées à leur équivalent mensuel.</div>
<footer>Gestion compte AP-LC • Rapport généré depuis votre appareil</footer>
<div class="screenOnly"><button onclick="window.print()">Créer / imprimer le PDF</button></div>
</main></body></html>`;
}
function printPDF(){
  const w=window.open('','_blank');
  if(!w){alert("Safari a bloqué l'ouverture du rapport. Autorisez les fenêtres surgissantes puis réessayez.");return}
  w.document.open();w.document.write(makePDFDocument());w.document.close();
}

function accountCategoryTotals(a){let cats={Logement:0,Alimentation:0,Transport:0,Loisirs:0,Autres:0};['expense','variable'].forEach(t=>(data[a][t]||[]).forEach(x=>{let l=String(x[0]).toLowerCase(),k=l.includes('logement')||l.includes('loyer')||l.includes('crédit')?'Logement':l.includes('aliment')||l.includes('course')?'Alimentation':l.includes('transport')||l.includes('essence')||l.includes('voiture')||l.includes('moto')?'Transport':l.includes('loisir')||l.includes('sortie')?'Loisirs':'Autres';cats[k]+=N(x[1])}));(data[a].annual||[]).forEach(x=>cats.Autres+=N(x[1])/12);return cats}
function drawAccountCharts(a){let c=document.getElementById('donut-'+a);if(c){let[x,r]=setupCanvas(c),cats=accountCategoryTotals(a),labs=Object.keys(cats),vals=labs.map(k=>cats[k]),total=vals.reduce((q,v)=>q+v,0),colors=['#5aa4ff','#13a85b','#ff7a00','#8c3be8','#ff4f67'],cx=r.width*.27,cy=r.height*.52,R=Math.min(r.height*.34,r.width*.18),w=28;if(total<=0){x.strokeStyle='#d9e9fb';x.lineWidth=w;x.beginPath();x.arc(cx,cy,R,0,Math.PI*2);x.stroke()}else{let start=-Math.PI/2;vals.forEach((v,i)=>{if(v<=0)return;let ang=v/total*Math.PI*2;x.strokeStyle=colors[i];x.lineWidth=w;x.beginPath();x.arc(cx,cy,R,start,start+ang);x.stroke();start+=ang})}x.fillStyle='#10244a';x.font='700 19px system-ui';x.textAlign='center';x.fillText(E(total),cx,cy);x.font='13px system-ui';x.fillText('Total',cx,cy+22);x.textAlign='left';labs.forEach((l,i)=>{let y=42+i*38;x.fillStyle=colors[i];x.beginPath();x.arc(r.width*.57,y,6,0,7);x.fill();x.fillStyle='#263a5b';x.fillText(l,r.width*.61,y+5);x.textAlign='right';x.fillText(E(vals[i]),r.width-12,y+5);x.textAlign='left'})}
let b=document.getElementById('bars-'+a);if(b){let[x,r]=setupCanvas(b),[inc,exp,bal]=totals(a),vals=[Math.max(0,inc),Math.max(0,exp),Math.max(0,bal)],labs=['Revenus','Dépenses','Solde'],colors=['#16a05d','#e3343f','#1677ff'],p={l:50,r:18,t:24,b:48},max=Math.max(1,...vals)*1.15,plotH=r.height-p.t-p.b,plotW=r.width-p.l-p.r,bw=Math.min(62,plotW/7);x.font='11px system-ui';x.strokeStyle='#dfe8f2';x.fillStyle='#61738f';for(let k=0;k<5;k++){let y=p.t+plotH*k/4;x.beginPath();x.moveTo(p.l,y);x.lineTo(r.width-p.r,y);x.stroke();x.textAlign='right';x.fillText(E(max*(1-k/4)).replace(',00',''),p.l-6,y+4)}vals.forEach((v,i)=>{let cx=p.l+plotW*(i+.5)/3,h=plotH*v/max;x.fillStyle=colors[i];x.fillRect(cx-bw/2,p.t+plotH-h,bw,h);x.fillStyle='#263a5b';x.textAlign='center';x.fillText(labs[i],cx,r.height-16);x.font='700 12px system-ui';x.fillText(E(i===2?bal:v),cx,Math.max(p.t+14,p.t+plotH-h-7));x.font='11px system-ui'})}}
function categoryTotals(){let cats={Logement:0,Alimentation:0,Transport:0,Loisirs:0,Autres:0};['u1','u2','common'].forEach(a=>['expense','variable'].forEach(t=>(data[a][t]||[]).forEach(x=>{if(a!=='common'&&t==='expense'&&flag(x,'feedCommon'))return;let l=String(x[0]).toLowerCase(),k=l.includes('logement')||l.includes('loyer')||l.includes('crédit')?'Logement':l.includes('aliment')||l.includes('course')?'Alimentation':l.includes('transport')||l.includes('essence')||l.includes('voiture')||l.includes('moto')?'Transport':l.includes('loisir')||l.includes('sortie')?'Loisirs':'Autres';cats[k]+=N(x[1])})));['u1','u2','common'].forEach(a=>(data[a].annual||[]).forEach(x=>cats.Autres+=N(x[1])/12));return cats}
function setupCanvas(c){let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.max(1,r.width*d);c.height=Math.max(1,r.height*d);let x=c.getContext('2d');x.scale(d,d);return[x,r]}
function drawCharts(){let c=document.getElementById('donut');if(c){let[x,r]=setupCanvas(c),cats=categoryTotals(),labs=Object.keys(cats),vals=labs.map(k=>cats[k]),total=vals.reduce((a,b)=>a+b,0),colors=['#5aa4ff','#13a85b','#ff7a00','#8c3be8','#ff4f67'],cx=r.width*.27,cy=r.height*.52,R=Math.min(r.height*.34,r.width*.18),w=28;if(total<=0){x.strokeStyle='#d9e9fb';x.lineWidth=w;x.beginPath();x.arc(cx,cy,R,0,Math.PI*2);x.stroke()}else{let start=-Math.PI/2;vals.forEach((v,i)=>{if(v<=0)return;let ang=v/total*Math.PI*2;x.strokeStyle=colors[i];x.lineWidth=w;x.beginPath();x.arc(cx,cy,R,start,start+ang);x.stroke();start+=ang})}x.fillStyle='#10244a';x.font='700 19px system-ui';x.textAlign='center';x.fillText(E(total),cx,cy);x.font='13px system-ui';x.fillText('Total',cx,cy+22);x.textAlign='left';x.font='13px system-ui';labs.forEach((l,i)=>{let y=42+i*38;x.fillStyle=colors[i];x.beginPath();x.arc(r.width*.57,y,6,0,7);x.fill();x.fillStyle='#263a5b';x.fillText(l,r.width*.61,y+5);x.textAlign='right';x.fillText(E(vals[i]),r.width-12,y+5);x.textAlign='left'})}
let l=document.getElementById('line');if(l){let[x,r]=setupCanvas(l),p={l:50,r:15,t:25,b:38},now=new Date(),keys=[],labels=[];for(let j=5;j>=0;j--){let d=new Date(now.getFullYear(),now.getMonth()-j,1);keys.push(monthKey(d));labels.push(d.toLocaleDateString('fr-FR',{month:'short'}).replace('.',''))}let vals=keys.map(k=>Number(data.history[k]||0));vals[5]=all()[1];let max=Math.max(1,...vals)*1.15;x.strokeStyle='#dfe8f2';x.lineWidth=1;x.font='11px system-ui';x.fillStyle='#61738f';for(let k=0;k<5;k++){let y=p.t+(r.height-p.t-p.b)*k/4;x.beginPath();x.moveTo(p.l,y);x.lineTo(r.width-p.r,y);x.stroke();x.textAlign='right';x.fillText(E(max*(1-k/4)).replace(',00',''),p.l-6,y+4)}x.textAlign='center';labels.forEach((m,i)=>x.fillText(m,p.l+(r.width-p.l-p.r)*i/5,r.height-10));x.strokeStyle='#1475ff';x.lineWidth=3;x.beginPath();vals.forEach((v,i)=>{let xx=p.l+(r.width-p.l-p.r)*i/5,yy=p.t+(r.height-p.t-p.b)*(1-v/max);i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke();vals.forEach((v,i)=>{let xx=p.l+(r.width-p.l-p.r)*i/5,yy=p.t+(r.height-p.t-p.b)*(1-v/max);x.fillStyle='#1475ff';x.beginPath();x.arc(xx,yy,4,0,7);x.fill()})}}
function render(){nav();dashboard();accountPage('u1');accountPage('u2');accountPage('common');settings();document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===current));requestAnimationFrame(()=>{if(current==='dashboard')drawCharts();else if(['u1','u2','common'].includes(current))drawAccountCharts(current)})}snapshot();render();window.addEventListener('resize',()=>{if(current==='dashboard')drawCharts();else if(['u1','u2','common'].includes(current))drawAccountCharts(current)});
</script>
